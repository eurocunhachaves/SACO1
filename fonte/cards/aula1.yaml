aula: 1
cards:

# ---------------------------------------------------------------- 1 · O que é saúde? (conceitos e planos)
- id: conceitos-tres
  tag: conceito
  tema: "Três formas de definir saúde"
  cloze: "Conceito **negativo**: saúde é {{c1::ausência de doença}}.\nConceito **positivo**: saúde é {{c2::um estado de bem-estar}}.\nConceito **ampliado**: saúde é {{c3::resultado das condições de vida}}."
  extra: "O negativo é a base do modelo biomédico; o positivo é a virada da OMS (1948); o ampliado foi consagrado na 8ª CNS (1986) e na CF88."
  fonte: "Parte 1 · seção 1.1"

- id: oms-definicao
  tag: conceito
  tema: "Definição da OMS"
  cloze: "Para a OMS ({{c4::1948}}), saúde é um estado de {{c1::completo bem-estar}} {{c2::físico, mental e social}}, e {{c3::não apenas}} a ausência de doença ou enfermidade."
  extra: "Novidades: conceito positivo (define saúde pelo que existe) e dimensão social. A criação da OMS foi proposta em 1945 por Brasil e China; a Constituição entrou em vigor em 7 de abril de 1948 (daí o “1945 → 1948” do slide)."
  fonte: "Parte 1 · seção 1.2 · slide 4"

- id: oms-pegadinha
  tag: conceito
  tema: "Pegadinha"
  frente: "Certo ou errado: “para a OMS, saúde é a ausência de doença”."
  verso: "**Errado.** A OMS diz que saúde **não é apenas** a ausência de doença."
  extra: "Trocar “não apenas” por “é a ausência” descreve o conceito negativo, não o da OMS."
  fonte: "Parte 1 · seção 1.2"

- id: oms-criticas
  tag: conceito
  tema: "Críticas à definição da OMS"
  cloze: "Críticas à definição da OMS:\n\n- {{c1::utópica}}: completo bem-estar é inalcançável\n- {{c2::estática}}: fala em “estado”, não em processo\n- {{c3::subjetiva}}: bem-estar depende de quem sente\n- pode justificar a {{c4::medicalização}} da vida"
  fonte: "Parte 1 · seção 1.2"

- id: ampliado-definicao
  tag: conceito
  tema: "Conceito ampliado"
  cloze: "{{c1::8ª Conferência Nacional de Saúde (1986)}}: em sentido abrangente, a saúde é a {{c2::resultante das condições}} de alimentação, habitação, educação, renda, meio ambiente, trabalho, transporte, emprego, lazer, liberdade, acesso e posse da terra e acesso a serviços de saúde."
  extra: "É o conceito ampliado. Depois entrou na CF88 (art. 196) e na Lei 8.080/1990 (art. 3º, determinantes e condicionantes)."
  fonte: "Parte 1 · seção 1.3"

- id: ampliado-art196
  tag: conceito
  tema: "Conceito ampliado"
  frente: "Que artigo da CF88 traduz o conceito ampliado ao garantir a saúde “mediante políticas sociais e econômicas”?"
  verso: "O **art. 196**."
  extra: "A prova pede para relacionar o art. 196 ao conceito ampliado (Parte 4)."
  prova: "Prova 88 (Q3); Compilado A (Q3)"
  fonte: "Parte 1 · seção 1.3"

- id: planos-subindividual
  tag: conceito
  tema: "Planos da condição de saúde"
  frente: "No plano **subindividual** (Narvai et al.), como aparece o processo saúde-doença?"
  verso: "Como **equilíbrio ou desequilíbrio** biológico (normalidade × disfunção, doença)."
  img: p1-planos.svg
  extra: "Nível dos órgãos e células, da fisiologia e da fisiopatologia. Exemplo: glicemia de jejum de 160 mg/dL."
  fonte: "Parte 1 · seção 1.4 · slide 5"

- id: planos-individual
  tag: conceito
  tema: "Planos da condição de saúde"
  frente: "No plano **individual** (Narvai et al.), o que se observa?"
  verso: "A **pessoa**, ser biológico e social, cujas alterações combinam o biológico com as **condições gerais de existência**."
  img: p1-planos.svg
  fonte: "Parte 1 · seção 1.4 · slide 6"

- id: planos-coletivo
  tag: conceito
  tema: "Planos da condição de saúde"
  frente: "No plano **coletivo** (Narvai et al.), como se entende a condição de saúde?"
  verso: "Como **expressão de um processo social mais amplo**, com determinantes em vários níveis de análise."
  img: p1-planos.svg
  extra: "A clínica trabalha sobretudo nos planos subindividual e individual; a saúde pública, no coletivo."
  fonte: "Parte 1 · seção 1.4 · slide 7"

# ---------------------------------------------------------------- 2 · Modelos explicativos
- id: linha-modelos
  tag: modelos
  tema: "Linha do tempo"
  cloze: "Ordem dos modelos explicativos: mágico-religioso → {{c1::miasmático}} → {{c2::microbiano (unicausal)}} → {{c3::biomédico}} → processual (HND) → {{c4::sistêmico}}."
  img: p1-linha-modelos.svg
  fonte: "Parte 1 · seção 2"

- id: magico-doenca
  tag: modelos
  tema: "Mágico-religioso"
  frente: "No modelo mágico-religioso, o que são a saúde e a doença?"
  verso: "Saúde é **dádiva** dos deuses; doença é **castigo** (pecado, forças sobrenaturais)."
  fonte: "Parte 1 · seção 2.1 · slide 8"

- id: magico-hoje
  tag: modelos
  tema: "Mágico-religioso"
  frente: "Benzedeiras, cirurgias espirituais, patuás e pagamento de promessas são exemplos atuais de qual modelo explicativo?"
  verso: "**Mágico-religioso.**"
  img: a1-s10.jpg
  extra: "Conhecer essas crenças não é concordar com elas: ajuda a entender a cultura do paciente e a criar vínculo."
  fonte: "Parte 1 · seção 2.1 · slide 10"

- id: higeia
  tag: modelos
  tema: "As filhas de Asclépio"
  frente: "Higeia (na imagem) e sua irmã Panaceia, filhas de Asclépio: o que cada uma representa?"
  verso: "**Higeia:** a prevenção (saúde coletiva, higiene).\n**Panaceia:** a cura (cuidado individual, medicina clínica)."
  img_frente: p1-higia.jpg
  extra: "**Hi**geia → **hi**giene → Movimento Higienista (França, 1829)."
  fonte: "Parte 1 · seção 2.1 · slide 9"

- id: miasma-definicao
  tag: modelos
  tema: "Teoria miasmática"
  frente: "Para a teoria miasmática (séculos XVIII e XIX), o que causava as doenças?"
  verso: "Os **miasmas**: emanações invisíveis que corrompiam o ar, geradas pela sujeira e pela putrefação."
  extra: "Errou o mecanismo, mas acertou ao ligar a doença à sujeira e à pobreza: gerou saneamento e quarentenas."
  fonte: "Parte 1 · seção 2.2 · slide 11"

- id: microbiana-logica
  tag: modelos
  tema: "Teoria microbiana"
  frente: "Qual é a lógica da teoria microbiana (fim do século XIX)?"
  verso: "**Unicausal**: um micro-organismo específico causa uma doença específica."
  extra: "Pasteur e Koch. Os postulados de Koch (1890) explicam o destaque do slide para essa data."
  img: p1-koch.jpg
  fonte: "Parte 1 · seção 2.3 · slide 12"

- id: biomedico-linear
  tag: modelos
  tema: "Modelo biomédico"
  frente: "Que modelo de saúde a prova chama de **linear**?"
  verso: "O **biomédico**: uma causa que, de forma **mecânica, unidirecional e progressiva**, explica o adoecer."
  extra: "Na discursiva, caracterize: unicausal e mecânico; individual, curativo, centrado no médico, fragmentado, especializado e hospitalocêntrico."
  prova: "Turma 90"
  fonte: "Parte 1 · seção 2.4 · slide 13"

- id: biomedico-seis
  tag: modelos
  tema: "Modelo biomédico"
  cloze: "As seis marcas do modelo biomédico: {{c1::individual}}, {{c2::curativo}}, {{c3::centrado no médico}}, {{c4::fragmentado}}, {{c5::especialista}} e {{c6::hospitalocêntrico}}."
  img: p1-biomedico.svg
  fonte: "Parte 1 · seção 2.4 · slide 14"

- id: biomedico-reconheca
  tag: modelos
  tema: "Reconheça o modelo"
  frente: "“Compreende o processo saúde-doença a partir das Ciências Biológicas e aceita a lógica linear do adoecimento, com a doença causada por um agente patológico específico.” Que modelo?"
  verso: "**Biomédico.**"
  prova: "Prova 88 (Q1b)"
  fonte: "Parte 1 · seção 2.4"

- id: biomedico-critica
  tag: modelos
  tema: "Modelo biomédico"
  frente: "A saúde coletiva critica o quê, exatamente, no modelo biomédico?"
  verso: "O **reducionismo**: explicar o adoecer só pela lesão ou pelo agente e ignorar as condições de vida."
  extra: "Não é uma crítica à ciência biológica, que trouxe antibióticos, UTIs e transplantes."
  fonte: "Parte 1 · seção 2.4"

# ---------------------------------------------------------------- 2.5 · Modelo processual (HND)
- id: processual-avanco
  tag: hnd
  tema: "Modelo processual (HND)"
  frente: "Por que o modelo processual é um avanço em relação ao biomédico (slide 15)?"
  verso: "Reconhece que características **sociais** dos indivíduos interferem na **chance** de adoecer, na **forma** de adoecer e na **repercussão** da doença."
  fonte: "Parte 1 · seção 2.5 · slide 15"

- id: hnd-triade
  tag: hnd
  tema: "Modelo processual (HND)"
  frente: "Na História Natural da Doença, que tríade ecológica explica o adoecer?"
  verso: "**Agente, hospedeiro e meio ambiente.**"
  img: p1-hnd.svg
  extra: "Modelo de Leavell e Clark, base dos níveis de prevenção."
  fonte: "Parte 1 · seção 2.5 · slide 16"

- id: hnd-periodos
  tag: hnd
  tema: "Modelo processual (HND)"
  cloze: "A HND tem dois períodos: o {{c1::pré-patogênico}} (ou epidemiológico), antes de a doença começar no organismo, e o {{c2::patogênico}} (ou patológico), com a doença em curso."
  extra: "No período patogênico, o **horizonte clínico** marca o aparecimento de sinais e sintomas."
  fonte: "Parte 1 · seção 2.5"

- id: processual-reconheca
  tag: hnd
  tema: "Reconheça o modelo"
  frente: "“Interação da tríade agente, hospedeiro e meio ambiente, com dois períodos sequenciados: o epidemiológico e o patológico.” Que modelo?"
  verso: "**Processual** (História Natural da Doença)."
  prova: "Prova 88 (Q1c)"
  fonte: "Parte 1 · seção 2.5"

- id: prevencao-niveis
  tag: hnd
  tema: "Níveis de prevenção"
  cloze: "Níveis de prevenção de Leavell e Clark:\n\n- **Primária**: {{c1::promoção da saúde e proteção específica}} (ex.: vacina)\n- **Secundária**: {{c2::diagnóstico precoce e tratamento imediato}} (ex.: rastreamento do câncer de colo do útero)\n- **Terciária**: {{c3::reabilitação}} (ex.: fisioterapia após AVC)"
  extra: "A primária atua no período pré-patogênico; a secundária e a terciária, no patogênico. A secundária inclui também a limitação da incapacidade."
  img: p1-hnd.svg
  fonte: "Parte 1 · seção 2.5"

- id: promocao-hnd-ottawa
  tag: hnd
  tema: "Pegadinha"
  frente: "A “promoção da saúde” da HND é a mesma da Carta de Ottawa?"
  verso: "**Não.** Na HND, é um nível da prevenção primária; em Ottawa, é um **campo próprio**, voltado aos determinantes sociais."
  fonte: "Parte 1 · seção 2.5"

- id: hnd-critica-estende
  tag: hnd
  tema: "Crítica à HND"
  frente: "A crítica à HND (as doenças não se restringem ao processo agente-hospedeiro) se estende também a qual modelo?"
  verso: "Ao **biomédico**."
  extra: "Os dois centram a explicação no agente e no hospedeiro e deixam de lado os determinantes sociais. <span class=\"div\">⚠ Um gabarito da Prova 89 traz “processual”, mas a HND já é o modelo processual.</span>"
  prova: "Turmas 91 e 90; Prova 89"
  fonte: "Parte 1 · seção 2.5"

# ---------------------------------------------------------------- 2.6–2.7 · Sistêmico e determinação social
- id: sistemico-niveis
  tag: modelos
  tema: "Modelo sistêmico"
  cloze: "Modelo sistêmico: fatores {{c1::políticos e socioeconômicos}}, {{c2::culturais}}, {{c3::ambientais}} e {{c4::agentes patogênicos}} se relacionam **em níveis**, e mudar um nível afeta os outros."
  img: p1-sistemico-dengue.svg
  extra: "Palavra-chave: **interdependência**. Não há causa única nem sequência simples."
  fonte: "Parte 1 · seção 2.6 · slides 17 e 18"

- id: sistemico-reconheca
  tag: modelos
  tema: "Reconheça o modelo"
  frente: "“Considera comportamentos culturais que possam relacionar-se à saúde de uma população e o perfil epidemiológico como fator importante.” Que modelo?"
  verso: "**Sistêmico.**"
  extra: "Os fatores culturais são um dos níveis do modelo (slides 17 e 18). <span class=\"div\">⚠ Um gabarito traz “determinação social”; os slides sustentam “sistêmico”.</span>"
  prova: "Prova 88 (Q1a)"
  fonte: "Parte 1 · seção 2.6"

- id: dss-determinacao
  tag: modelos
  tema: "Determinantes × determinação"
  frente: "Qual a diferença entre **determinantes sociais da saúde** e **determinação social**?"
  verso: "Determinantes: **fatores** (renda, escolaridade, moradia). Determinação social: o adoecer resulta da **organização da sociedade** como um todo."
  extra: "Nas provas, “camadas” e “níveis de intervenção” costumam apontar para os determinantes (Dahlgren e Whitehead, Parte 2)."
  fonte: "Parte 1 · seção 2.7 · slide 19"

# ---------------------------------------------------------------- 3 · Modelos de atenção
- id: explicativo-atencao
  tag: atencao
  tema: "Explicar × atender"
  frente: "Qual a diferença entre **modelo explicativo** e **modelo de atenção**?"
  verso: "Explicativo: diz **por que** se adoece. De atenção: diz **como se organizam** as ações e os serviços."
  extra: "A prova às vezes chama os dois de “modelo de intervenção do processo saúde-doença-cuidado”."
  fonte: "Parte 1 · seção 3"

- id: atencao-paim
  tag: atencao
  tema: "Modelos de atenção"
  frente: "Segundo Paim, o que é um modelo de atenção?"
  verso: "Uma combinação de **tecnologias** para intervir sobre problemas e necessidades de saúde: a **lógica** que orienta a ação."
  fonte: "Parte 1 · seção 3"

- id: atencao-hegemonicos
  tag: atencao
  tema: "Modelos de atenção"
  frente: "Quais são os dois modelos de atenção **hegemônicos** no Brasil?"
  verso: "**Médico-assistencial privatista** e **sanitarista** (campanhista)."
  extra: "Alternativas que buscam superá-los: vigilância da saúde (atua sobre o território) e Estratégia Saúde da Família (população adscrita)."
  fonte: "Parte 1 · seção 3"

- id: privatista-demanda
  tag: atencao
  tema: "Médico-assistencial privatista"
  frente: "O modelo médico-assistencial privatista responde a que tipo de demanda?"
  verso: "À **demanda espontânea** (quem procura o serviço), com foco no hospital e na cura."
  fonte: "Parte 1 · seção 3"

- id: sanitarista-reconheca
  tag: atencao
  tema: "Reconheça o modelo"
  frente: "“Combinação de tecnologias para o controle de danos e riscos; não contempla a integralidade nem a descentralização; caráter temporário e direção centralizada.” Que modelo de atenção?"
  verso: "**Sanitarista** (campanhista)."
  extra: "Organiza-se por campanhas e programas especiais. Exemplo histórico: as campanhas de Oswaldo Cruz (Parte 3)."
  prova: "Turma 91"
  fonte: "Parte 1 · seção 3"

- id: privatista-covid
  tag: atencao
  tema: "Reconheça o modelo"
  frente: "Na COVID-19, governos priorizaram hospitais de campanha em vez da Atenção Primária e da vigilância. Que modelo de atenção é esse?"
  verso: "**Médico-assistencial privatista** (hospitalocêntrico)."
  prova: "Prova 82; prova do grupo (2020.2)"
  fonte: "Parte 1 · seção 3"

- id: tecnologia-dica
  tag: atencao
  tema: "Reconheça o modelo"
  frente: "Questão sobre tecnologia: controle de danos e riscos **na população** (vacinação em massa, combate a vetores), por campanhas. Que modelo?"
  verso: "**Sanitarista.**"
  extra: "Tecnologia de diagnóstico e tratamento **individual** (exames, especialistas, hospital) aponta para o biomédico / médico-assistencial."
  prova: "Prova 89 (Q6)"
  fonte: "Parte 1 · Como cai na prova"
