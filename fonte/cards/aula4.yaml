# Aula 4 · O SUS na CF88 (formato descrito em aula1.yaml)
aula: 4
cards:

# ---------------------------------------------------------------- 1 · Proteção social e seguridade (arts. 194 e 195)
- id: sistema-oms
  tag: seguridade
  tema: "Sistema de saúde"
  cloze: "Sistema de saúde (OMS, 2000): um conjunto coerente de diversos componentes {{c1::inter-relacionados}}, {{c2::setoriais e intersetoriais}}, que produzem efeito na população."
  fonte: "Parte 4 · seção 1.1 · slide 3"

- id: sistema-servicos
  tag: seguridade
  tema: "Sistema de saúde"
  frente: "Qual a diferença entre sistema de saúde e sistema de serviços de saúde?"
  verso: "O sistema de saúde inclui **tudo o que produz efeito na saúde**, dentro e fora do setor. O sistema de serviços é a **rede de unidades e profissionais**, uma parte dele."
  extra: "Slide 4: a saúde é social. A UBS que trabalha com a escola do bairro já atua no sistema de saúde: é a intersetorialidade."
  img: p4-sistemas.svg
  fonte: "Parte 4 · seção 1.1 · slides 3 e 4"

- id: componentes
  tag: seguridade
  tema: "Sistema de serviços"
  cloze: "Os quatro componentes do sistema de serviços de saúde: {{c1::Estado}}, {{c1::prestadores de serviços}}, {{c1::seguradoras e planos de saúde}} e {{c1::população}}."
  extra: "Entre quem presta e quem recebe, quem paga a conta é o Estado (dinheiro público) ou a seguradora (dinheiro privado)."
  img: p4-componentes.svg
  fonte: "Parte 4 · seção 1.1 · slide 5"

- id: protecao-definicao
  tag: seguridade
  tema: "Proteção social"
  frente: "O que é um sistema de proteção social?"
  verso: "Mecanismos que a sociedade cria para proteger as pessoas contra o que limita suas necessidades fundamentais: **doença, velhice, invalidez, desemprego e pobreza**."
  extra: "Slide 8: o sistema de saúde está atrelado ao de proteção social. Quem protege só quem trabalha terá saúde só para quem trabalha."
  fonte: "Parte 4 · seção 1.2 · slides 6 e 8"

- id: modelo-oculta-seguridade
  tag: seguridade
  tema: "Modelos de proteção social"
  frente: "Que modelo de proteção social tem estas características?"
  oculta: p4-protecao-oculta-seguridade.svg
  revelada: p4-protecao.svg
  verso: "**Seguridade social** (base: cidadania)."
  extra: "Modelo beveridgiano (Relatório Beveridge, 1942). No Canadá, os hospitais são em geral privados, mas todos são atendidos e o Estado paga."
  fonte: "Parte 4 · seção 1.2 · slides 8 e 9"

- id: modelo-oculta-seguro
  tag: seguridade
  tema: "Modelos de proteção social"
  frente: "Que modelo de proteção social tem estas características?"
  oculta: p4-protecao-oculta-seguro.svg
  revelada: p4-protecao.svg
  verso: "**Seguro social** (base: trabalho)."
  extra: "Modelo bismarckiano (seguro-doença alemão, 1883)."
  fonte: "Parte 4 · seção 1.2 · slide 10"

- id: modelo-oculta-assistencia
  tag: seguridade
  tema: "Modelos de proteção social"
  frente: "Que modelo de proteção social tem estas características?"
  oculta: p4-protecao-oculta-assistencia.svg
  revelada: p4-protecao.svg
  verso: "**Assistência** (base: mercado)."
  extra: "Nos EUA, o Estado cobre os pobres (Medicaid) e os idosos (Medicare), ambos de 1965."
  fonte: "Parte 4 · seção 1.2 · slides 11 e 12"

- id: trajetoria
  tag: seguridade
  tema: "A trajetória brasileira"
  cloze: "Proteção social no Brasil:\n\n- até 1923: {{c1::caridade}};\n- de 1923 a 1988: {{c2::seguro social}} (CAPs, IAPs, INPS, INAMPS);\n- desde a CF88: {{c3::seguridade social}}."
  img: p4-trajetoria.svg
  fonte: "Parte 4 · seção 1.3 · slide 13"

- id: sus-origem
  tag: seguridade
  tema: "O SUS nasce na CF88"
  frente: "Segundo o slide 14, o SUS foi fruto de quê?"
  verso: "De **reivindicações populares** e do **Movimento da Reforma Sanitária Brasileira**."
  extra: "O marco do movimento foi a 8ª CNS (1986). Dela, a CF88 herdou o conceito ampliado, a saúde como direito de todos e dever do Estado, o sistema único e a participação da comunidade."
  fonte: "Parte 4 · seção 1.3 · slide 14"

- id: slide15
  tag: seguridade
  tema: "Cidadania no lugar da contribuição"
  frente: "O slide 15 risca quatro ideias e põe uma no centro. Quais?"
  verso: "Risca **seguro social, assistência, poder aquisitivo e caridade**. No centro, a **cidadania**."
  extra: "O direito à saúde não depende de carteira assinada, de contribuição nem de renda."
  img: a4-s15.jpg
  fonte: "Parte 4 · seção 1.3 · slide 15"

- id: seguro-pegadinha
  tag: seguridade
  tema: "Pegadinha"
  frente: "Certo ou errado: “por adotar uma concepção ampla do direito à saúde, a CF88 escolheu o seguro social”."
  verso: "**Errado.** A CF88 adotou a **seguridade social**."
  prova: "Prova 82 (Q4, item I); Compilado B (Q4)"
  fonte: "Parte 4 · seção 1.3 · Na prova"

- id: antes-depois
  tag: seguridade
  tema: "Antes e depois da CF88"
  frente: "Diferencie a proteção social no Brasil antes e depois da CF88."
  verso: "Antes: **seguro social**, só para quem contribuía (CAPs, IAPs, INPS, INAMPS). Depois: **seguridade social**, com a saúde como **direito de todos**, sem contribuição."
  prova: "Roteiro de estudo (Q7)"
  fonte: "Parte 4 · seção 1.3 · slide 13"

- id: art194
  tag: seguridade
  tema: "Art. 194"
  cloze: "Art. 194: a seguridade social é um {{c1::conjunto integrado de ações}} de iniciativa {{c2::dos Poderes Públicos e da sociedade}}, para assegurar os direitos relativos à saúde, à previdência e à assistência social."
  fonte: "Parte 4 · seção 1.4 · slide 16"

- id: tripe-oculta-previdencia
  tag: seguridade
  tema: "O tripé da seguridade"
  frente: "Qual pilar da seguridade social é este?"
  oculta: p4-tripe-oculta-previdencia.svg
  revelada: p4-tripe.svg
  verso: "**Previdência social**: o único pilar contributivo."
  fonte: "Parte 4 · seção 1.4 · slide 17"

- id: tripe-oculta-saude
  tag: seguridade
  tema: "O tripé da seguridade"
  frente: "Qual pilar da seguridade social é este?"
  oculta: p4-tripe-oculta-saude.svg
  revelada: p4-tripe.svg
  verso: "**Saúde** (o SUS)."
  fonte: "Parte 4 · seção 1.4 · slide 17"

- id: tripe-oculta-assistencia
  tag: seguridade
  tema: "O tripé da seguridade"
  frente: "Qual pilar da seguridade social é este?"
  oculta: p4-tripe-oculta-assistencia.svg
  revelada: p4-tripe.svg
  verso: "**Assistência social.**"
  extra: "Exemplo: o Benefício de Prestação Continuada (BPC), para idosos e pessoas com deficiência de baixa renda."
  fonte: "Parte 4 · seção 1.4 · slide 17"

- id: duas-assistencias
  tag: seguridade
  tema: "Pegadinha"
  frente: "Qual a diferença entre **assistência social** (pilar da seguridade) e **assistência** (modelo de proteção)?"
  verso: "Assistência social é **direito** de quem precisa, sem contribuição. Assistência como modelo é o **de mercado**: o Estado só ajuda os comprovadamente pobres."
  fonte: "Parte 4 · seção 1.4"

- id: art195
  tag: seguridade
  tema: "Art. 195"
  frente: "Quem financia a seguridade social, e por quais fontes (art. 195)?"
  verso: "**Toda a sociedade**: pelos **orçamentos** da União, dos Estados, do DF e dos Municípios e pelas **contribuições sociais** (do empregador, do trabalhador, dos concursos de prognósticos e do importador)."
  extra: "A EC nº 132/2023 criou a CBS, que substitui a partir de 2027 as contribuições sobre faturamento e do importador. Na prova, vale a lista do slide."
  img: p4-financiamento.svg
  fonte: "Parte 4 · seção 1.5 · slides 18 e 19"

- id: tripe-subsistemas
  tag: seguridade
  tema: "Pegadinha"
  frente: "Na questão “caracterize os três subsistemas que vieram antes do SUS”, por que não responder com o tripé da seguridade?"
  verso: "Porque o tripé é da **CF88**. Antes do SUS, os subsistemas são **CAPs, IAPs e INPS** (Parte 3)."
  extra: "<span class=\"div\">⚠ O gabarito dos alunos da Prova 85 usa o tripé. Use-o só se a questão falar em seguridade.</span>"
  prova: "Prova 85 (Q8)"
  fonte: "Parte 4 · seção 1.5 · Na prova"

# ---------------------------------------------------------------- 2 · Arts. 196 a 200
- id: art196
  tag: artigos
  tema: "Art. 196"
  cloze: "Art. 196: a saúde é {{c1::direito de todos}} e {{c2::dever do Estado}}, garantido mediante {{c3::políticas sociais e econômicas}} que visem à redução do risco de doença e de outros agravos e ao acesso {{c4::universal e igualitário}} às ações e serviços para sua {{c5::promoção, proteção e recuperação}}."
  img: p4-art196.svg
  fonte: "Parte 4 · seção 2.1 · slide 20"

- id: art196-principios
  tag: artigos
  tema: "Art. 196"
  frente: "Que princípios do SUS aparecem no art. 196?"
  verso: "**Universalidade** (“direito de todos”, “acesso universal”), **igualdade/equidade** (“igualitário”) e **integralidade** (“promoção, proteção e recuperação”)."
  prova: "Prova 88 (Q3); Turma 91 (Q4); Turma 86"
  fonte: "Parte 4 · seção 2.1 · Na prova"

- id: art196-conceito
  tag: artigos
  tema: "Art. 196"
  frente: "A que conceito de saúde o art. 196 se refere? Por quê?"
  verso: "Ao **conceito ampliado**: a saúde é garantida por **políticas sociais e econômicas**, e não só por serviços médicos."
  extra: "Palavras-chave do slide 20: cidadania, Estado, determinação social, intersetorialidade e conceito ampliado."
  prova: "Prova 88 (Q3); Turma 91 (Q4); Prova 85 (Q3)"
  fonte: "Parte 4 · seção 2.1 · Na prova"

- id: ordem-ppr
  tag: artigos
  tema: "Promover, proteger, recuperar"
  frente: "Por que a ordem “promoção, proteção e recuperação” do art. 196 importa?"
  verso: "Primeiro **promover**, depois **proteger** e, por último, **recuperar**. O modelo assistencialista erra ao começar pela recuperação."
  extra: "Promoção: condições de vida (saneamento, alimentação saudável). Proteção: riscos específicos (vacinação, vigilância). Recuperação: diagnóstico, tratamento e reabilitação."
  fonte: "Parte 4 · seção 2.1 · slide 20"

- id: relevancia-por-que
  tag: artigos
  tema: "Art. 197"
  frente: "Por que as ações e serviços de saúde são de relevância pública?"
  verso: "Porque a saúde é **direito fundamental**, de interesse de toda a coletividade. Por isso o poder público **regulamenta, fiscaliza e controla** até o serviço privado."
  extra: "Art. 197: a execução pode ser direta ou por terceiros, inclusive pessoa física ou jurídica de direito privado."
  prova: "Prova 89 (Q2); Prova 88 (Q4)"
  fonte: "Parte 4 · seção 2.2 · slide 21"

- id: art197-qual
  tag: artigos
  tema: "Art. 197"
  frente: "Qual artigo da CF88 trata da relevância pública das ações e serviços de saúde?"
  verso: "O **art. 197**."
  extra: "<span class=\"div\">⚠ Um arquivo do Compilado A responde “arts. 197 e 198”; a expressão está só no art. 197.</span>"
  prova: "Prova 85 (Q4); Compilado A (Q4)"
  fonte: "Parte 4 · seção 2.2 · Na prova"

- id: diretrizes
  tag: artigos
  tema: "Art. 198"
  cloze: "Diretrizes do art. 198:\n\n- I. {{c1::descentralização}}, com direção única em cada esfera de governo;\n- II. {{c2::atendimento integral}}, com prioridade para as atividades preventivas, sem prejuízo dos serviços assistenciais;\n- III. {{c3::participação da comunidade}}."
  extra: "“Sem prejuízo dos serviços assistenciais”: prevenir vem antes, mas o tratamento não pode faltar."
  prova: "Turma 91 (Q7); Turma 90 (Q5); Turma 84"
  fonte: "Parte 4 · seção 2.3 · slide 22"

- id: direcao-unica
  tag: artigos
  tema: "Art. 198"
  frente: "Quem exerce a direção única do SUS em cada esfera de governo?"
  verso: "O **Ministério da Saúde**, a **Secretaria Estadual** e a **Secretaria Municipal** de Saúde."
  img: p4-direcao.svg
  fonte: "Parte 4 · seção 2.3 · slide 22"

- id: rede-pegadinha
  tag: artigos
  tema: "Pegadinha"
  frente: "O enunciado diz que o SUS é uma “rede regionalizada e hierarquizada” e pede as diretrizes do art. 198. A rede é uma delas?"
  verso: "**Não.** A rede regionalizada e hierarquizada está no caput. As diretrizes são os três incisos: **descentralização**, **atendimento integral** e **participação da comunidade**."
  prova: "Turma 91 (Q7); Turma 90 (Q5)"
  fonte: "Parte 4 · seção 2.3"

- id: art199-como
  tag: artigos
  tema: "Art. 199"
  frente: "Como a iniciativa privada participa do SUS (art. 199, § 1º)?"
  verso: "De forma **complementar**, segundo as diretrizes do SUS, por **contrato de direito público ou convênio**, com preferência às **filantrópicas e sem fins lucrativos**."
  extra: "Caput: a assistência à saúde é livre à iniciativa privada."
  img: a4-s23.jpg
  prova: "Prova 89 (Q7); Prova 88 (Q5); Turma 91 (Q2)"
  fonte: "Parte 4 · seção 2.4 · slide 23"

- id: subvencao-pegadinha
  tag: artigos
  tema: "Pegadinha"
  frente: "Certo ou errado: “o SUS pode destinar recursos públicos para ampliar hospitais privados com fins lucrativos”."
  verso: "**Errado.** O art. 199, § 2º, veda auxílios ou subvenções a instituições privadas **com fins lucrativos**."
  extra: "O SUS pode contratar um exame de uma clínica privada (gratuito para o usuário), mas não pode subsidiar o negócio privado."
  fonte: "Parte 4 · seção 2.4 · slide 23"

- id: art200
  tag: artigos
  tema: "Art. 200"
  cloze: "Compete ao SUS (art. 200), entre outras coisas:\n\n- executar a {{c1::vigilância sanitária e epidemiológica}} e a saúde do trabalhador;\n- ordenar a {{c2::formação de recursos humanos}} em saúde;\n- participar das ações de {{c3::saneamento básico}};\n- fiscalizar {{c4::alimentos, bebidas e águas}} para consumo humano."
  fonte: "Parte 4 · seção 2.5 · slides 24 a 26"

- id: art200-pegadinha
  tag: artigos
  tema: "Pegadinha"
  frente: "Certo ou errado: “compete ao SUS comercializar sangue e hemoderivados para financiar a rede pública”."
  verso: "**Errado.** O SUS participa da **produção** de hemoderivados (art. 200, I), mas o art. 199, § 4º, veda **todo tipo de comercialização** de órgãos, tecidos, sangue e derivados."
  fonte: "Parte 4 · seção 2.5"

- id: artigos-relance
  tag: artigos
  tema: "Os artigos num relance"
  cloze: "Art. 196: {{c1::direito de todos e dever do Estado}}.\nArt. 197: {{c2::relevância pública}}.\nArt. 198: {{c3::sistema único, rede e diretrizes}}.\nArt. 199: {{c4::iniciativa privada}}.\nArt. 200: {{c5::competências do SUS}}."
  extra: "Antes deles, no capítulo da seguridade: art. 194 (saúde, previdência e assistência social) e art. 195 (financiamento)."
  fonte: "Parte 4 · seção 2 · slides 20 a 26"

# ---------------------------------------------------------------- 3 · Os princípios do SUS
- id: doutrinarios-oculta
  tag: principios
  tema: "Princípios do SUS"
  frente: "Quais são os princípios **doutrinários** do SUS?"
  oculta: p4-principios-oculta-doutrinarios.svg
  revelada: p4-principios.svg
  verso: "**Universalidade, igualdade/equidade e integralidade.**"
  extra: "Também chamados de ideológicos ou finalísticos."
  prova: "Compilado A (Q2); Turma 90 (Q10)"
  fonte: "Parte 4 · seção 3 · slide 27"

- id: universalidade
  tag: principios
  tema: "Universalidade"
  frente: "O que é o princípio da universalidade?"
  verso: "A saúde é **direito de cidadania**: todos têm direito aos serviços de saúde, **em todos os níveis de assistência**."
  extra: "Ninguém precisa provar que contribui, que é pobre ou que mora no país: um turista atendido pelo SAMU também está sob esse princípio."
  img: p4-vacinacao-alt.jpg
  fonte: "Parte 4 · seção 3.1 · slide 28"

- id: maria-jose
  tag: principios
  tema: "Reconheça o princípio"
  frente: "A Sra. Maria José não foi atendida na USF da sua área porque as senhas do dia tinham acabado. Que princípio foi violado, e como ele se classifica?"
  verso: "**Universalidade**, princípio **doutrinário**."
  prova: "Turma 91 (Q1); Turma 90 (Q1); Prova 89 (Q1)"
  fonte: "Parte 4 · seção 3.1 · Na prova"

- id: equidade-formula
  tag: principios
  tema: "Equidade"
  cloze: "Equidade = {{c1::igualdade + justiça}}: dar {{c2::mais a quem precisa mais}}."
  img: p4-equidade.svg
  fonte: "Parte 4 · seção 3.2 · slide 29"

- id: equidade-prioridades
  tag: principios
  tema: "Equidade"
  cloze: "Pela equidade, têm prioridade:\n\n- as {{c1::regiões com piores condições de saúde}};\n- as {{c2::pessoas com mais vulnerabilidade e risco}};\n- os {{c3::usuários em situações clínicas mais graves}}."
  extra: "Exemplo do último caso: a classificação de risco nas urgências."
  fonte: "Parte 4 · seção 3.2 · slide 30"

- id: equidade-politicas
  tag: principios
  tema: "Equidade"
  frente: "Cite três públicos das políticas de promoção da equidade em saúde (slide 31)."
  verso: "Por exemplo: **população negra**, **povos indígenas** e **população LGBT**."
  extra: "Também as populações do campo, da floresta e das águas, a população em situação de rua, o povo cigano, as pessoas privadas de liberdade, imigrantes e refugiados e as pessoas com albinismo."
  img: a4-s31.jpg
  fonte: "Parte 4 · seção 3.2 · slide 31"

- id: igualdade-ou-equidade
  tag: principios
  tema: "Igualdade ou equidade?"
  frente: "Na prova, escreva igualdade ou equidade?"
  verso: "**Os dois.** A CF88 e a Lei nº 8.080 dizem igualdade; os documentos do Ministério da Saúde consagraram equidade."
  extra: "Na lista de princípios da PNPS (Parte 2), a palavra certa é equidade."
  fonte: "Parte 4 · seção 3.2"

- id: integralidade
  tag: principios
  tema: "Integralidade"
  cloze: "Integralidade (Lei nº 8.080/1990, art. 7º, II): conjunto {{c1::articulado e contínuo}} das ações e serviços {{c2::preventivos e curativos}}, {{c3::individuais e coletivos}}, exigidos para cada caso, em {{c4::todos os níveis de complexidade}} do sistema."
  img: p4-acs.jpg
  fonte: "Parte 4 · seção 3.3 · slide 32"

- id: hiv
  tag: principios
  tema: "Reconheça o princípio"
  frente: "Uma paciente recebe o diagnóstico de HIV na consulta do plano e é encaminhada ao CTA e depois ao Centro de Referência do SUS. Que princípio assegura esse atendimento na rede?"
  verso: "**Integralidade.**"
  extra: "Vale citar também a universalidade: ter plano de saúde não tira o direito ao SUS."
  prova: "Prova 82 (Q2); Compilado B (Q2); prova do grupo (2020.2)"
  fonte: "Parte 4 · seção 3.3 · Na prova"

- id: horizontal-vertical
  tag: principios
  tema: "Integralidade"
  frente: "No roteiro da disciplina, o que são as dimensões horizontal e vertical da integralidade?"
  verso: "**Horizontal**: a rede, entre os níveis de atenção (referência e contrarreferência). **Vertical**: a pessoa inteira, com sua história e condições de vida."
  extra: "<span class=\"div\">⚠ Alguns autores usam os termos ao contrário. Na discursiva, diga a dimensão e explique o sentido.</span>"
  fonte: "Parte 4 · seção 3.3"

- id: frase-universalidade
  tag: principios
  tema: "Reconheça o princípio"
  frente: "“A saúde é direito de todos e dever do Estado.” Que princípio do SUS?"
  verso: "**Universalidade.**"
  prova: "Prova 82 (Q3); Compilado B (Q3)"
  fonte: "Parte 4 · Como cai na prova"

- id: frase-igualdade
  tag: principios
  tema: "Reconheça o princípio"
  frente: "“Todos devem ser atendidos, sem preconceito ou privilégios de qualquer espécie.” Que princípio do SUS?"
  verso: "**Igualdade/equidade.**"
  extra: "<span class=\"div\">⚠ O slide 28 usa essa expressão para a universalidade, mas na Lei nº 8.080 (art. 7º, IV) ela define a igualdade, como em todos os gabaritos.</span>"
  prova: "Prova 82 (Q3); Compilado B (Q3)"
  fonte: "Parte 4 · Como cai na prova"

- id: frase-integralidade
  tag: principios
  tema: "Reconheça o princípio"
  frente: "“Ações e serviços oferecidos ao indivíduo e aos grupos, contemplando prevenção e tratamento, com respeito à dignidade humana.” Que princípio do SUS?"
  verso: "**Integralidade.**"
  prova: "Prova 82 (Q3); Compilado B (Q3)"
  fonte: "Parte 4 · Como cai na prova"

- id: organizativos-oculta
  tag: principios
  tema: "Princípios do SUS"
  frente: "Quais são os princípios **organizativos** do SUS?"
  oculta: p4-principios-oculta-organizativos.svg
  revelada: p4-principios.svg
  verso: "**Descentralização**, **regionalização e hierarquização** e **participação e controle social**."
  extra: "Alguns gabaritos somam a resolubilidade e a complementaridade do setor privado (ABC do SUS, 1990)."
  prova: "Compilado A (Q2); Turma 90 (Q10)"
  fonte: "Parte 4 · seção 3.4 · slide 33"

- id: cabecalho-pegadinha
  tag: principios
  tema: "Pegadinha"
  frente: "Os slides 34 a 37 trazem no topo “Princípios Doutrinários”. Descentralização, regionalização, hierarquização e participação são doutrinários?"
  verso: "**Não.** São **organizativos**, como mostra o slide 33."
  fonte: "Parte 4 · seção 3.4"

- id: descentralizacao
  tag: principios
  tema: "Descentralização"
  frente: "O que é descentralização no SUS?"
  verso: "**Redistribuir responsabilidades**, poder e recursos entre União, estados e municípios, com **direção única** em cada esfera e ênfase na **municipalização**."
  fonte: "Parte 4 · seção 3.4 · slide 34"

- id: direcao-unica-prova
  tag: principios
  tema: "Reconheça o princípio"
  frente: "“União, estados e municípios exercem sua autoridade pelo Ministério da Saúde e pelas Secretarias, de forma autônoma e com direção única em cada esfera.” Que princípio?"
  verso: "**Descentralização.**"
  prova: "Prova 82 (Q10); Compilado B (Q11)"
  fonte: "Parte 4 · seção 3.4 · Na prova"

- id: regionalizacao
  tag: principios
  tema: "Regionalização"
  frente: "O que é regionalização?"
  verso: "Organizar o sistema com **base territorial e populacional**, para distribuir bem os serviços, com **equidade de acesso**, **otimização dos recursos** e **racionalidade dos gastos**."
  extra: "Por isso nem todo município precisa de cirurgia cardíaca: a região compartilha os serviços mais complexos."
  img: a4-s35.jpg
  fonte: "Parte 4 · seção 3.4 · slide 35"

- id: hierarquizacao
  tag: principios
  tema: "Hierarquização"
  frente: "O que é hierarquização?"
  verso: "Organizar os serviços por **níveis de complexidade crescente**, com **fluxos assistenciais** definidos entre eles."
  extra: "A atenção primária é a porta de entrada. Quando a UBS não resolve, o usuário é referenciado à média ou à alta complexidade e, depois, contrarreferenciado de volta."
  img: p4-hierarquia.svg
  fonte: "Parte 4 · seção 3.4 · slide 36"

- id: referencia-prova
  tag: principios
  tema: "Referência e contrarreferência"
  frente: "Que princípios a referência e a contrarreferência operacionalizam? Em que dimensão?"
  verso: "**Hierarquização e regionalização** e **integralidade**. Dimensão **horizontal**: os encaminhamentos entre os níveis."
  extra: "<span class=\"div\">⚠ “Horizontal” segue o roteiro de estudo; há autores que chamam esse eixo de vertical. Explique o sentido.</span>"
  prova: "Prova do grupo (2020.2, Q10)"
  fonte: "Parte 4 · seção 3.4 · Na prova"

- id: ras
  tag: principios
  tema: "Redes de Atenção à Saúde"
  frente: "O que são as Redes de Atenção à Saúde (RAS)?"
  verso: "Arranjos de serviços de diferentes densidades tecnológicas, **integrados** para garantir a **integralidade**. A atenção primária fica no **centro**, como coordenadora do cuidado."
  extra: "Portaria GM/MS nº 4.279/2010."
  prova: "Turma 84 (2ª prova)"
  fonte: "Parte 4 · seção 3.4 · Na prova"

- id: participacao
  tag: principios
  tema: "Participação e controle social"
  frente: "O que é participação e controle social?"
  verso: "A população, por suas **entidades representativas**, participa da **formulação, do controle e da execução** das políticas de saúde, em todos os níveis."
  extra: "Está no art. 198, III (participação da comunidade)."
  img: p4-conselho.jpg
  fonte: "Parte 4 · seção 3.4 · slide 37"

- id: conferencias-conselhos
  tag: principios
  tema: "Participação e controle social"
  cloze: "Lei nº 8.142/1990: as conferências de saúde reúnem-se a cada {{c1::quatro anos}}; os conselhos de saúde são {{c2::permanentes e deliberativos}}."
  extra: "Nos dois, a representação dos usuários é paritária: metade das vagas. A Lei nº 8.142 também trata das transferências de recursos, pontos que Collor vetara na Lei nº 8.080."
  fonte: "Parte 4 · seção 3.4 · slide 37"

- id: sus-definicao
  tag: principios
  tema: "O que é o SUS"
  frente: "Onde está a definição legal do SUS?"
  verso: "No **art. 4º da Lei nº 8.080/1990**: o conjunto de ações e serviços de saúde prestados por órgãos e instituições **públicas** das três esferas de governo."
  extra: "Inclui a administração direta e indireta e as fundações mantidas pelo Poder Público. O privado entra em caráter complementar (art. 4º, § 2º)."
  fonte: "Parte 4 · seção 3.5 · slide 38"

- id: atividade-fisica
  tag: principios
  tema: "A Lei nº 8.080 atualizada"
  frente: "Que lei incluiu a atividade física entre os determinantes e condicionantes da saúde?"
  verso: "A **Lei nº 12.864/2013** (art. 3º da Lei nº 8.080)."
  prova: "Turma 84 (2ª prova)"
  fonte: "Parte 4 · seção 3.5"

- id: principios-novos
  tag: principios
  tema: "A Lei nº 8.080 atualizada"
  cloze: "Princípios novos do art. 7º da Lei nº 8.080:\n\n- 2017: atendimento especializado a {{c1::mulheres e vítimas de violência doméstica}};\n- 2023: proteção dos {{c2::direitos humanos}} dos usuários, em especial crianças e adolescentes;\n- 2025: {{c3::atenção humanizada}}."
  prova: "Turma 84 (2ª prova)"
  fonte: "Parte 4 · seção 3.5"
