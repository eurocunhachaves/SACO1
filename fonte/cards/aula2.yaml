# Aula 2 · Promoção da Saúde (formato descrito em aula1.yaml)
aula: 2
cards:

# ---------------------------------------------------------------- 1 · Origens e os dois enfoques
- id: sigerist-tarefas
  tag: origens
  tema: "Sigerist"
  cloze: "Para Sigerist, as quatro tarefas da medicina são {{c1::promover a saúde}}, {{c1::prevenir doenças}}, {{c1::recuperar os enfermos}} e {{c1::reabilitar}}."
  img: p2-sigerist.jpg
  extra: "Para ele, a saúde se promove com **condições de vida decentes**: bom trabalho, educação, cultura, lazer e descanso. É apontado como o primeiro a usar a expressão “promoção da saúde”."
  fonte: "Parte 2 · seção 1.1 · slide 2"

- id: definicao-buss-carvalho
  tag: origens
  tema: "Definição de promoção"
  cloze: "Promoção da saúde é um conjunto de {{c1::estratégias e formas de produzir saúde}}, no âmbito {{c2::individual e coletivo}}, visando atender às necessidades sociais de saúde e à melhoria da qualidade de vida."
  extra: "Buss e Carvalho (2009), slide 3. A PNPS usa quase a mesma frase no art. 2º."
  prova: "Prova 82 (Q1, item I: correto)"
  fonte: "Parte 2 · seção 1.1 · slide 3"

- id: lalonde-campo
  tag: origens
  tema: "Informe Lalonde"
  cloze: "Informe Lalonde (Canadá, 1974): o campo da saúde tem quatro componentes:\n\n- {{c1::biologia humana}};\n- {{c1::ambiente}};\n- {{c2::estilo de vida}};\n- {{c2::organização da assistência à saúde}}."
  img: p2-lalonde.svg
  fonte: "Parte 2 · seção 1.2 · slide 4"

- id: lalonde-marco
  tag: origens
  tema: "Informe Lalonde"
  frente: "Por que o Informe Lalonde é o marco inaugural da promoção da saúde moderna?"
  verso: "Foi o **primeiro documento oficial de um governo** a questionar o custo e o impacto da assistência médica: o gasto ia para a assistência, mas as causas de doença estavam na biologia, no ambiente e no **estilo de vida**."
  extra: "Crítica: as ações que ele inspirou miraram sobretudo a **mudança de hábitos**, com risco de culpabilizar o indivíduo. Numa discursiva, cite as duas coisas."
  prova: "Turmas 91 e 90; Prova 89 (Q10)"
  fonte: "Parte 2 · seção 1.2"

- id: lalonde-pegadinha
  tag: origens
  tema: "Pegadinha"
  frente: "Certo ou errado: “segundo o Informe Lalonde, promoção da saúde é o processo de capacitação da comunidade para atuar na melhoria de sua qualidade de vida e saúde”."
  verso: "**Errado.** Essa definição é da **Carta de Ottawa (1986)**."
  prova: "Prova 82 (Q1, item IV)"
  fonte: "Parte 2 · seção 1.2"

- id: enfoques-nomes
  tag: origens
  tema: "Os dois grandes grupos"
  frente: "Quais são os dois grandes grupos (enfoques) na operacionalização da promoção da saúde, e que nome o slide dá a cada um?"
  verso: "**Comportamental** (modelo **regulador**) e **socioambiental** (modelo **emancipador**)."
  img: a2-s05.jpg
  extra: "O regulador quer **regular a conduta**; o emancipador quer **dar poder** e mudar as condições de vida."
  prova: "Prova 88 (Q7); Prova 82 (Q9); Compilado B (Q10)"
  fonte: "Parte 2 · seção 1.3 · slide 5"

- id: comportamental-intervencao
  tag: origens
  tema: "Enfoque comportamental"
  frente: "Como o enfoque **comportamental** intervém?"
  verso: "Com **programas educativos** para mudar **hábitos individuais** (fumo, dieta, sedentarismo, direção perigosa)."
  extra: "Crítica central: a **culpabilização da vítima**. Se cada um responde sozinho pela própria saúde, as causas políticas e econômicas somem e o governo se desresponsabiliza."
  prova: "Prova 88 (Q7); Prova 82 (Q9)"
  fonte: "Parte 2 · seção 1.3"

- id: socioambiental-intervencao
  tag: origens
  tema: "Enfoque socioambiental"
  frente: "Como o enfoque **socioambiental** intervém?"
  verso: "Sobre os **determinantes sociais**, com **políticas públicas**, ambientes favoráveis, **intersetorialidade** e participação social."
  extra: "O estilo de vida continua na lista, mas visto como algo **condicionado** pelo ambiente, pela renda e pela informação."
  prova: "Prova 88 (Q7); Prova 82 (Q9)"
  fonte: "Parte 2 · seção 1.3"

- id: iceberg
  tag: origens
  tema: "O iceberg do slide 6"
  frente: "Na metáfora do iceberg (slide 6), o que fica abaixo da linha d'água?"
  verso: "Os **determinantes sociais**. O comportamento é só a ponta visível."
  img: p2-iceberg.svg
  fonte: "Parte 2 · seção 1.3 · slide 6"

# ---------------------------------------------------------------- 2 · Alma-Ata, Ottawa e as conferências
- id: almaata-quem
  tag: conferencias
  tema: "Alma-Ata (1978)"
  frente: "Quem convocou a conferência de Alma-Ata (1978), qual era o tema e que meta ela lançou?"
  verso: "**OMS e UNICEF**; os **cuidados primários de saúde**; a meta **“Saúde para Todos no Ano 2000”**."
  img: p2-almaty-palacio.jpg
  extra: "Alma-Ata **não** é conferência de promoção da saúde: a primeira é **Ottawa (1986)**."
  fonte: "Parte 2 · seção 2.1 · slide 7"

- id: almaata-oito
  tag: conferencias
  tema: "Os oito elementos"
  cloze: "Oito elementos dos cuidados primários (Alma-Ata):\n\n- condições de vida: {{c1::educação em saúde}}, {{c1::alimentação e nutrição}}, {{c1::água e saneamento}};\n- proteção: {{c2::saúde materno-infantil e planejamento familiar}}, {{c2::imunização}}, {{c2::controle de doenças endêmicas}};\n- assistência: {{c3::tratamento de doenças e lesões comuns}}, {{c3::medicamentos essenciais}}."
  img: p2-almaata.svg
  extra: "Recurso de memória: 3 + 3 + 2."
  fonte: "Parte 2 · seção 2.1 · slide 8"

- id: almaata-importancia
  tag: conferencias
  tema: "Alma-Ata e a promoção"
  frente: "Por que Alma-Ata importa para a promoção da saúde?"
  verso: "Pôs na agenda **direito, equidade, intersetorialidade e participação**, **recolocou os determinantes sociais em destaque** e inspirou a Carta de Ottawa."
  extra: "Por isso o item “a Conferência de Alma-Ata ressalta os DSS ao destacar a Saúde para Todos no Ano 2000” é **correto**."
  prova: "Turmas 91 e 90; Prova 89 (Q10); Prova 88 (Q9, item II)"
  fonte: "Parte 2 · seção 2.1"

- id: almaata-brasil
  tag: conferencias
  tema: "Alma-Ata no Brasil"
  frente: "Cite duas iniciativas brasileiras em consonância com Alma-Ata para ampliar a cobertura dos serviços."
  verso: "**PIASS** e **AIS** (Ações Integradas de Saúde, 1983)."
  extra: "O PREV-SAÚDE (1980) também vale, mas não foi implantado. O PIASS é de 1976, anterior à conferência, e foi ampliado em 1979. <span class=\"div\">⚠ Um arquivo traz “AIS e SUDS”; o SUDS (1987) já é transição para o SUS.</span>"
  prova: "Prova 82 (Q7); Prova 85 (Q10); Compilado A (Q7)"
  fonte: "Parte 2 · seção 2.1"

- id: ottawa-definicao
  tag: conferencias
  tema: "Carta de Ottawa (1986)"
  cloze: "Carta de Ottawa: promoção da saúde é o processo de {{c1::capacitação da comunidade}} para atuar na melhoria da sua qualidade de vida e saúde, incluindo uma maior {{c2::participação no controle}} deste processo."
  extra: "Na prova, a frase vem sozinha e pede o nome do modelo: **promoção da saúde**. <span class=\"div\">⚠ “Sistêmico” e “vigilância da saúde” não correspondem à definição.</span>"
  prova: "Prova 82 (Q5B); Compilado B (Q6); Turma 84"
  fonte: "Parte 2 · seção 2.2 · slide 9"

- id: ottawa-tres-ideias
  tag: conferencias
  tema: "Carta de Ottawa (1986)"
  frente: "Que três ideias sustentam a Carta de Ottawa, segundo o slide 10?"
  verso: "**Equidade**, **determinantes múltiplos** da saúde e **intersetorialidade**."
  extra: "A promoção não é responsabilidade exclusiva do setor saúde, e a saúde é um **recurso para a vida**, não o objetivo de viver."
  fonte: "Parte 2 · seção 2.2 · slide 10"

- id: ottawa-prerequisitos
  tag: conferencias
  tema: "Pré-requisitos para a saúde"
  cloze: "Pré-requisitos para a saúde (Ottawa): {{c1::paz}}, {{c1::habitação}}, {{c1::educação}}, {{c1::alimentação}}, {{c1::renda}}; {{c2::ecossistema estável}}, {{c2::recursos sustentáveis}}, {{c2::justiça social e equidade}}."
  extra: "Quase nenhum deles depende do setor saúde."
  fonte: "Parte 2 · seção 2.2 · slide 11"

- id: ottawa-estrategias
  tag: conferencias
  tema: "Estratégias de Ottawa"
  cloze: "As três estratégias da Carta de Ottawa: {{c1::defesa de causa (advocacy)}}, {{c1::capacitação}} e {{c1::mediação}}."
  extra: "Mediação: o setor saúde sozinho não garante os pré-requisitos, e é preciso fazer a ponte entre interesses diferentes."
  fonte: "Parte 2 · seção 2.2"

- id: ottawa-campos
  tag: conferencias
  tema: "Campos de ação de Ottawa"
  cloze: "Os cinco campos de ação da Carta de Ottawa:\n\n- {{c1::políticas públicas saudáveis}};\n- {{c1::ambientes favoráveis}};\n- {{c2::reforço da ação comunitária}};\n- {{c2::desenvolvimento de habilidades pessoais}};\n- {{c3::reorientação dos serviços de saúde}}."
  img: p2-ottawa.svg
  extra: "A ordem é um *zoom*: Estado → lugar → comunidade → pessoa → serviço. Reorientar não é construir mais hospitais: é ir além da função curativa."
  fonte: "Parte 2 · seção 2.2 · slide 13"

- id: campo-ambientes
  tag: conferencias
  tema: "Campos de ação: reconheça"
  frente: "Saneamento, praças e ciclovias: que campo de ação de Ottawa?"
  verso: "**Ambientes favoráveis.**"
  img_frente: p2-ciclovia.jpg
  extra: "Lei Antifumo = políticas públicas saudáveis; conselhos e hortas comunitárias = ação comunitária; Saúde da Família = reorientação dos serviços."
  fonte: "Parte 2 · seção 2.2"

- id: conf-temas
  tag: conferencias
  tema: "Conferências"
  cloze: "Conferências internacionais de promoção da saúde:\n\n- 1986, Ottawa: a carta fundadora;\n- 1988, Adelaide: {{c1::políticas públicas saudáveis}};\n- 1991, Sundsvall: {{c2::ambientes favoráveis à saúde}};\n- 1997, Jacarta: {{c3::reforço da ação comunitária (empoderamento)}};\n- 2000, México: equidade;\n- 2005, Bangkok: determinantes num mundo globalizado;\n- 2009, Nairóbi: lacuna de implementação;\n- 2013, Helsinque: {{c4::Saúde em Todas as Políticas}};\n- 2016, Xangai: {{c5::desenvolvimento sustentável (Agenda 2030)}};\n- 2021, Genebra: {{c6::bem-estar}}."
  img: p2-conferencias.svg
  extra: "As três primeiras depois de Ottawa aprofundam, em ordem, os três primeiros campos de ação. Adelaide teve quatro áreas prioritárias: saúde da mulher, alimentação, tabaco e álcool, ambientes. Sundsvall fica na Suécia (não na “Suíça”)."
  fonte: "Parte 2 · seção 2.3 · slides 14 a 23"

- id: conf-helsinque
  tag: conferencias
  tema: "Conferências"
  frente: "Qual conferência consagrou a abordagem **Saúde em Todas as Políticas**?"
  verso: "**Helsinque** (Finlândia, 2013)."
  extra: "Cada setor considera, de forma sistemática, as consequências das suas decisões para a saúde e a equidade."
  fonte: "Parte 2 · seção 2.3 · slide 20"

# ---------------------------------------------------------------- 3 · Determinantes sociais
- id: dss-cndss
  tag: dss
  tema: "Determinantes sociais"
  cloze: "DSS, segundo a CNDSS: fatores {{c1::sociais, econômicos, culturais, étnicos/raciais, psicológicos e comportamentais}} que influenciam a ocorrência de problemas de saúde e seus fatores de risco na população."
  prova: "Prova 88 (Q9, item I: correto)"
  fonte: "Parte 2 · seção 3.1"

- id: iniquidade
  tag: dss
  tema: "Iniquidades"
  frente: "O que torna uma desigualdade em saúde uma **iniquidade**?"
  verso: "Ser **evitável, injusta e desnecessária**."
  extra: "Idosos adoecem mais que jovens: desigualdade. Crianças pobres morrem mais que as ricas: iniquidade."
  fonte: "Parte 2 · seção 3.1"

- id: dw-oculta-core
  tag: dss
  tema: "Dahlgren e Whitehead"
  frente: "Modelo de Dahlgren e Whitehead: o que está no centro?"
  oculta: p2-dahlgren-oculta-core.svg
  revelada: p2-dahlgren.svg
  verso: "**Idade, sexo e fatores hereditários.**"
  extra: "Não é nível de intervenção, porque não se modifica por política."
  fonte: "Parte 2 · seção 3.2 · slide 12"

- id: dw-oculta-estilo
  tag: dss
  tema: "Dahlgren e Whitehead"
  frente: "Modelo de Dahlgren e Whitehead: qual camada está oculta?"
  oculta: p2-dahlgren-oculta-estilo.svg
  revelada: p2-dahlgren.svg
  verso: "**Estilo de vida dos indivíduos.**"
  extra: "Fica no limiar entre o individual e o social: as escolhas são condicionadas por informação, propaganda e acesso."
  fonte: "Parte 2 · seção 3.2 · slide 12"

- id: dw-oculta-redes
  tag: dss
  tema: "Dahlgren e Whitehead"
  frente: "Modelo de Dahlgren e Whitehead: qual camada está oculta?"
  oculta: p2-dahlgren-oculta-redes.svg
  revelada: p2-dahlgren.svg
  verso: "**Redes sociais e comunitárias.**"
  extra: "A riqueza dessas redes expressa o nível de coesão social."
  fonte: "Parte 2 · seção 3.2 · slide 12"

- id: dw-oculta-cond
  tag: dss
  tema: "Dahlgren e Whitehead"
  frente: "Modelo de Dahlgren e Whitehead: qual camada está oculta?"
  oculta: p2-dahlgren-oculta-cond.svg
  revelada: p2-dahlgren.svg
  verso: "**Condições de vida e de trabalho.**"
  extra: "Produção de alimentos, educação, ambiente de trabalho, desemprego, água e esgoto, serviços de saúde e habitação."
  fonte: "Parte 2 · seção 3.2 · slide 12"

- id: dw-oculta-macro
  tag: dss
  tema: "Dahlgren e Whitehead"
  frente: "Modelo de Dahlgren e Whitehead: qual camada está oculta?"
  oculta: p2-dahlgren-oculta-macro.svg
  revelada: p2-dahlgren.svg
  verso: "**Condições socioeconômicas, culturais e ambientais gerais** (os macrodeterminantes)."
  extra: "É o setor **mais abrangente** da figura e influencia todas as outras camadas."
  prova: "Prova 85 (Q9); Turma 86"
  fonte: "Parte 2 · seção 3.2 · slide 12"

- id: dw-niveis
  tag: dss
  tema: "Níveis de intervenção"
  cloze: "Níveis de intervenção de Dahlgren e Whitehead:\n\n- 1º: {{c1::comportamentos e estilos de vida}};\n- 2º: {{c1::comunidades e redes de relações}};\n- 3º: {{c2::condições de vida e de trabalho}};\n- 4º: {{c2::macrodeterminantes}}."
  extra: "Os quatro começam com C: Comportamento, Comunidade, Condições, Contexto."
  fonte: "Parte 2 · seção 3.2"

- id: dw-coesao
  tag: dss
  tema: "Níveis de intervenção"
  frente: "Fortalecer a coesão social, a solidariedade e a confiança é intervenção de qual nível?"
  verso: "**2º nível** (comunidades e redes de relações), e não do 1º."
  prova: "Prova 88 (Q9, item IV)"
  fonte: "Parte 2 · seção 3.2"

- id: dw-intersetorial
  tag: dss
  tema: "Níveis de intervenção"
  frente: "Água limpa, esgoto, habitação, emprego e serviços dependem de setores diferentes. Que nível de intervenção exige essa ação integrada (intersetorial)?"
  verso: "O **3º nível** (condições de vida e de trabalho)."
  img: p2-saneamento.jpg
  extra: "A intersetorialidade vale também para os macrodeterminantes; o 1º nível é o dos comportamentos."
  prova: "Prova 88 (Q9, item V)"
  fonte: "Parte 2 · seção 3.2"

- id: dw-alimentacao
  tag: dss
  tema: "Relacione às camadas"
  frente: "“Alimentação” fica em qual camada de Dahlgren e Whitehead?"
  verso: "Depende: o **hábito alimentar** é estilo de vida; a **produção e o acesso** a alimentos são condições de vida."
  prova: "Prova 89 (Q3)"
  fonte: "Parte 2 · seção 3.2"

- id: diderichsen-enfase
  tag: dss
  tema: "Diderichsen e Hallqvist"
  frente: "O que o modelo de Diderichsen e Hallqvist enfatiza?"
  verso: "A **estratificação social**: o contexto distribui as pessoas em **posições sociais**, e cada posição gera diferenciais de saúde."
  img: p2-diderichsen.svg
  extra: "Dahlgren e Whitehead mostram **onde** intervir; Diderichsen explica **como** a desigualdade vira doença."
  fonte: "Parte 2 · seção 3.3"

- id: diderichsen-mecanismos
  tag: dss
  tema: "Diderichsen e Hallqvist"
  cloze: "Os mecanismos de Diderichsen: I {{c1::estratificação social}}; II a IV, diferenciais de {{c2::exposição}}, de {{c2::vulnerabilidade}} e de {{c2::consequências}}."
  fonte: "Parte 2 · seção 3.3"

- id: diderichsen-pegadinha
  tag: dss
  tema: "Pegadinha"
  frente: "“Posição social, exposição específica, doença ou acidente e consequências sociais” são elementos de qual modelo?"
  verso: "Do modelo de **Diderichsen e Hallqvist**, e não do de Dahlgren e Whitehead."
  extra: "Gabarito da questão dos itens I a VI: **I e II**. <span class=\"div\">⚠ Um arquivo traz “I e III”; o artigo sustenta “I e II”.</span>"
  prova: "Prova 88 (Q9, itens III e VI)"
  fonte: "Parte 2 · seção 3.3"

# ---------------------------------------------------------------- 4 · Promoção × prevenção
- id: pp-marco
  tag: prevencao
  tema: "Promoção × prevenção"
  frente: "Qual é o marco conceitual da prevenção? E o da promoção?"
  verso: "Prevenção: **História Natural da Doença**. Promoção: **Determinantes Sociais da Saúde**."
  fonte: "Parte 2 · seção 4.1 · slide 25"

- id: pp-palavras
  tag: prevencao
  tema: "Promoção × prevenção"
  cloze: "Prevenir (*praevenire*): {{c1::preparar, chegar antes, impedir}}. Promover (*promovere*): {{c2::impulsionar, fomentar, gerar, mudar}}."
  fonte: "Parte 2 · seção 4.1 · slide 26"

- id: pp-foco
  tag: prevencao
  tema: "Promoção × prevenção"
  frente: "Qual é o foco da prevenção? E o da promoção?"
  verso: "Prevenção: **a doença**. Promoção: os **determinantes estruturais** que produzem iniquidades."
  extra: "A prevenção olha para a doença; a promoção olha para a vida."
  fonte: "Parte 2 · seção 4.1 · slide 27"

- id: pp-sujeito
  tag: prevencao
  tema: "Promoção × prevenção"
  frente: "Como cada uma opera e qual o lugar do sujeito: prevenção × promoção?"
  verso: "Prevenção: ação **pontual, unilateral, intrassetorial**; sujeito **receptivo**. Promoção: ações **multiestratégicas e intersetoriais**; sujeito **participativo, corresponsável**."
  fonte: "Parte 2 · seção 4.1 · slides 28 e 29"

- id: pp-slogans-prevencao
  tag: prevencao
  tema: "Expressões típicas"
  frente: "Classifique: “Evite!”, “Mexa-se!”, “Faça sua parte!” × “Participe!”, “cidades saudáveis”, “qualidade de vida”."
  verso: "Os primeiros são de **prevenção** (cobram mudança do indivíduo); os segundos, de **promoção** (coletivo, ambiente e participação)."
  img: a2-s30.jpg
  fonte: "Parte 2 · seção 4.1 · slide 30"

- id: pp-destinacao
  tag: prevencao
  tema: "Promoção × prevenção"
  frente: "A quem se destinam as medidas de promoção? E as de prevenção?"
  verso: "Promoção: **toda a população e o ambiente**. Prevenção: **grupos de risco e patologias específicas**."
  extra: "A promoção parte de um conceito positivo e ampliado de saúde; a prevenção, da ausência de doença."
  prova: "Prova 85 (Q7); Compilado A (Q5); Turma 86"
  fonte: "Parte 2 · seção 4.1"

- id: ppr-art196
  tag: prevencao
  tema: "Promoção, proteção, recuperação"
  cloze: "Ações de {{c1::promoção}}: alimentação saudável na escola, ciclovias, saneamento. Ações de {{c2::proteção}}: vacinação, vigilância sanitária e epidemiológica. Ações de {{c3::recuperação}}: consultas, exames, cirurgias, fisioterapia."
  prova: "Prova 88 (Q6)"
  fonte: "Parte 2 · seção 4.2"

- id: sasaki
  tag: prevencao
  tema: "Estudo na Saúde da Família"
  frente: "Qual foi a principal confusão revelada pelo estudo de Sasaki e Ribeiro (2013) com a equipe de Saúde da Família?"
  verso: "**Promoção confundida com prevenção** (“promoção é tudo aquilo que você pode prevenir”)."
  fonte: "Parte 2 · seção 4.3 · slides 31 a 38"

# ---------------------------------------------------------------- 5 · Princípios e PNPS
- id: principios-oms
  tag: pnps
  tema: "Princípios da OMS"
  cloze: "Os sete princípios da promoção da saúde (OMS):\n\n- {{c1::concepção holística}};\n- {{c1::intersetorialidade}};\n- {{c2::participação social}};\n- {{c2::empoderamento}};\n- {{c3::equidade}};\n- {{c3::ações multiestratégicas}};\n- {{c3::sustentabilidade}}."
  extra: "Uma visão holística exige intersetorialidade; as pessoas participam e se empoderam; o objetivo é a equidade; o método são ações multiestratégicas; e tudo precisa ser sustentável. O slide 24 soma **autonomia** e **integralidade**, que vêm da PNPS."
  prova: "Prova 89 (Q5); Turma 91 (Q5); Turma 90 (Q4); Turma 86"
  fonte: "Parte 2 · seção 5.1 · slide 24"

- id: principios-exceto
  tag: pnps
  tema: "Princípios: exceto"
  frente: "Holística, equidade com intersetorialidade, participação social, sustentabilidade, práticas curativas como base do cuidado. Qual **não** é princípio da promoção da saúde?"
  verso: "**Práticas curativas como base do cuidado**, que pertencem ao modelo biomédico."
  prova: "Prova 88 (Q10)"
  fonte: "Parte 2 · seção 5.1"

- id: igualdade-pegadinha
  tag: pnps
  tema: "Pegadinha"
  frente: "Certo ou errado: “igualdade” está entre os princípios da PNPS."
  verso: "**Errado.** O princípio é **equidade**: eliminar as diferenças desnecessárias, evitáveis e injustas, tratando de forma diferente quem tem necessidades diferentes."
  prova: "Prova 82 (Q1, item II)"
  fonte: "Parte 2 · seção 5.1"

- id: principios-pnps
  tag: pnps
  tema: "Princípios da PNPS"
  cloze: "Os nove princípios da PNPS (art. 4º): {{c1::equidade}}, {{c1::participação social}}, {{c1::autonomia}}; {{c2::empoderamento}}, {{c2::intersetorialidade}}, {{c2::intrassetorialidade}}; {{c3::sustentabilidade}}, {{c3::integralidade}}, {{c3::territorialidade}}."
  extra: "Recurso de memória: “Epa! Ei! Sit!”, com as iniciais na ordem do artigo. Solidariedade, felicidade, ética e justiça social são **valores** (art. 3º), não princípios."
  fonte: "Parte 2 · seção 5.1"

- id: so-pnps
  tag: pnps
  tema: "OMS × PNPS"
  frente: "Que princípios aparecem na PNPS, mas não na lista da OMS?"
  verso: "**Autonomia, intrassetorialidade, integralidade e territorialidade.**"
  extra: "Só a OMS tem concepção holística e ações multiestratégicas. As outras cinco aparecem nas duas listas."
  fonte: "Parte 2 · seção 5.1"

- id: pnps-portarias
  tag: pnps
  tema: "PNPS"
  cloze: "A PNPS foi instituída em {{c1::2006 (Portaria nº 687)}}, revisada em {{c2::2014 (Portaria nº 2.446)}} e incorporada em 2017 à Portaria de Consolidação nº 2 (Anexo I)."
  fonte: "Parte 2 · seção 5.2"

- id: pnps-objetivo
  tag: pnps
  tema: "PNPS"
  cloze: "Objetivo geral da PNPS: promover a {{c1::equidade}} e a melhoria das condições e modos de viver, reduzindo vulnerabilidades e riscos decorrentes dos {{c2::determinantes sociais, econômicos, políticos, culturais e ambientais}}."
  prova: "Prova 82 (Q1, item III: correto)"
  fonte: "Parte 2 · seção 5.2 · art. 6º"

- id: pnps-temas
  tag: pnps
  tema: "Temas prioritários da PNPS"
  cloze: "Os oito temas prioritários da PNPS: {{c1::formação e educação permanente}}; {{c2::alimentação adequada e saudável}} e {{c2::práticas corporais e atividades físicas}}; enfrentamento do {{c3::uso do tabaco}} e do {{c3::uso abusivo de álcool e outras drogas}}; promoção da {{c4::mobilidade segura}}, da {{c4::cultura da paz e dos direitos humanos}} e do {{c4::desenvolvimento sustentável}}."
  img: p2-pnps-temas.svg
  extra: "Recurso de memória: 1 + 2 + 2 + 3 = 8. Na prova, basta citar cinco."
  prova: "Prova 88 (Q8); Turma 84; Prova 82 (Q1, item V)"
  fonte: "Parte 2 · seção 5.2 · slides 41 a 46"

- id: pnps-tema-feira
  tag: pnps
  tema: "Temas prioritários da PNPS"
  frente: "Qual tema prioritário da PNPS esta foto de feira livre ilustra?"
  verso: "**Alimentação adequada e saudável.**"
  img_frente: p2-feira.jpg
  fonte: "Parte 2 · seção 5.2"

- id: buss2020-mensagem
  tag: pnps
  tema: "Buss et al. (2020)"
  frente: "Qual é a mensagem central de Buss et al. (2020) sobre quarenta anos de promoção da saúde?"
  verso: "Mais do que acesso a bons serviços, é preciso enfrentar os **determinantes da saúde** em toda a sua amplitude."
  extra: "Para isso: políticas públicas saudáveis, ação intersetorial e mobilização da população. Estratégias promissoras: cidades saudáveis, Saúde em Todas as Políticas, desenvolvimento local sustentável."
  fonte: "Parte 2 · seção 5.3"
