# Aula 3 · Políticas de Saúde antes do SUS (formato descrito em aula1.yaml)
aula: 3
cards:

# ---------------------------------------------------------------- 1 · Da Colônia à República Velha
- id: chaves-leitura
  tag: colonia-republica
  tema: "Duas chaves de leitura"
  cloze: "Chave 1: a política de saúde acompanha a {{c1::política econômica e social}} do país.\nChave 2: até 1988, a saúde da população {{c2::nunca foi prioridade}}; o Estado agia em crises e só dava assistência médica a quem {{c3::contribuía para a previdência}}."
  fonte: "Parte 3 · seção 1.1 · slide 2"

- id: dicotomia
  tag: colonia-republica
  tema: "A dicotomia"
  frente: "Qual era a dicotomia do sistema de saúde brasileiro antes do SUS?"
  verso: "**Ações preventivas e coletivas** (saúde pública) × **ações curativas e individuais** (previdência, só para quem contribuía)."
  img: p3-dicotomia.svg
  extra: "De um lado nasceu o **sanitarismo campanhista**; do outro, o **médico-assistencial privatista**. A **integralidade** do SUS junta os dois."
  fonte: "Parte 3 · seção 1.1 · slide 3"

- id: item-economia-dicotomia
  tag: colonia-republica
  tema: "Certo ou errado"
  frente: "Certo ou errado: “na Colônia, no Império e na República Velha, a saúde se caracterizou pela estreita relação com o modelo econômico e pela dicotomia entre saúde pública e assistência médica”."
  verso: "**Certo.**"
  prova: "Prova 82 (Q4, item III); Compilado B (Q4)"
  fonte: "Parte 3 · seção 1.1"

- id: quarentena-lazareto
  tag: colonia-republica
  tema: "Colônia e Império"
  frente: "Qual era a principal medida sanitária da Colônia e do Império? Onde ela acontecia?"
  verso: "A **quarentena**, feita nos **lazaretos**."
  img: p3-lazareto.jpg
  extra: "A explicação das epidemias era a teoria miasmática. O **alvará de 1810** regulou a quarentena no porto do Rio: o alvo era o **porto e o comércio**."
  fonte: "Parte 3 · seção 1.2 · slide 5"

- id: tres-maneiras
  tag: colonia-republica
  tema: "Três maneiras de ser atendido"
  cloze: "Na Colônia e no Império:\n\n- a elite tinha a {{c1::medicina liberal}} (médicos particulares);\n- índios, negros e pobres, a {{c2::medicina popular}} (pajés, curandeiros, sangradores);\n- os indigentes, as {{c3::Santas Casas de Misericórdia}} (caridade, e não direito)."
  img: p3-santa-casa.jpg
  fonte: "Parte 3 · seção 1.2 · slide 6"

- id: oswaldo-campanhas
  tag: colonia-republica
  tema: "Oswaldo Cruz"
  cloze: "Campanhas de Oswaldo Cruz (a partir de 1903):\n\n- febre amarela: {{c1::combate ao mosquito (brigadas de mata-mosquitos)}};\n- peste bubônica: {{c2::combate aos ratos}};\n- varíola: {{c3::vacinação obrigatória}}."
  img: p3-aedes.jpg
  fonte: "Parte 3 · seção 1.3 · slide 7"

- id: campanhismo-pecas
  tag: colonia-republica
  tema: "Sanitarismo campanhista"
  cloze: "O sanitarismo campanhista combinava {{c1::campanhas sanitárias}}, {{c2::polícia sanitária}} e {{c3::medidas jurídicas}} (notificação e vacinação obrigatórias, vigilância sanitária)."
  extra: "A polícia sanitária entrava nas casas, desinfetava, removia doentes e mandava demolir imóveis insalubres."
  fonte: "Parte 3 · seção 1.3 · slide 7"

- id: oswaldo-vacina
  tag: colonia-republica
  tema: "Oswaldo Cruz"
  frente: "Qual campanha de **vacinação** Oswaldo Cruz conduziu?"
  verso: "A vacinação obrigatória **contra a varíola** (Lei nº 1.261, de 1904)."
  extra: "A febre amarela foi combatida com o controle do mosquito, e a peste, com o combate aos ratos."
  prova: "Turma 84 (2ª prova, Q1)"
  fonte: "Parte 3 · seção 1.4"

- id: revolta-vacina
  tag: colonia-republica
  tema: "Revolta da Vacina (1904)"
  frente: "Esta charge de 1904 critica a vacinação obrigatória contra a varíola. Por que a reação, na Revolta da Vacina, foi tão forte?"
  verso: "O **autoritarismo** das campanhas, a **invasão das casas**, o medo da vacina e as **demolições** que expulsavam os pobres do centro do Rio."
  img_frente: p3-revolta-vacina-alt.jpg
  extra: "A obrigatoriedade foi suspensa."
  fonte: "Parte 3 · seção 1.4"

- id: dnsp
  tag: colonia-republica
  tema: "Carlos Chagas e o DNSP"
  frente: "Que órgão foi criado em 1920, e quem o dirigiu?"
  verso: "O **Departamento Nacional de Saúde Pública (DNSP)**, dirigido por **Carlos Chagas**."
  img: p3-carlos-chagas.jpg
  extra: "Trouxe a **propaganda e a educação sanitária** como rotina. Na ciência, a bacteriologia substitui a teoria miasmática (o “×” do slide)."
  fonte: "Parte 3 · seção 1.5 · slide 8"

- id: eloy-chaves
  tag: colonia-republica
  tema: "Lei Eloy Chaves (1923)"
  frente: "O que a Lei Eloy Chaves (Decreto nº 4.682, de 24 de janeiro de 1923) criou?"
  verso: "As **Caixas de Aposentadoria e Pensões (CAPs)**, uma por **empresa ferroviária**."
  img: p3-eloy-chaves.jpg
  extra: "É o **marco inicial da previdência social** no Brasil. Ofereciam benefícios previdenciários e assistência médica."
  fonte: "Parte 3 · seção 1.6 · slide 9"

- id: caps-tripartite-pegadinha
  tag: colonia-republica
  tema: "Pegadinha"
  frente: "Certo ou errado: “o financiamento das CAPs era tripartite: empregadores, trabalhadores e Governo”."
  verso: "**Errado.** Era **bipartite** (empregados e empregadores). Tripartite, com o Estado, é a marca dos **IAPs**."
  prova: "Prova 82 (Q4, item II); Compilado B (Q4)"
  fonte: "Parte 3 · seção 1.6 · slide 9"

- id: campanha-assistencialismo
  tag: colonia-republica
  tema: "Campanha × assistencialismo"
  frente: "Qual a diferença entre a política sanitarista de **campanha** e o modelo **assistencialista**?"
  verso: "Campanha: ações **pontuais, intensivas e coletivas** contra uma doença. Assistencialismo: atendimento **contínuo, individual e curativo**, para quem tinha direito pela previdência."
  prova: "Prova 85 (Q6); Turma 86"
  fonte: "Parte 3 · seção 1.7 · slide 10"

# ---------------------------------------------------------------- 2 · Era Vargas e período democrático
- id: mesp
  tag: vargas
  tema: "Era Vargas"
  frente: "Que ministério cuidou da saúde pública a partir de 1930?"
  verso: "O **Ministério da Educação e Saúde Pública (MESP)**."
  img: p3-vargas.jpg
  extra: "A previdência, e com ela a assistência médica de quem tinha carteira, ficou no Ministério do Trabalho."
  fonte: "Parte 3 · seção 2.1 · slide 11"

- id: cap-iap-mnemo
  tag: vargas
  tema: "CAPs × IAPs"
  cloze: "Na {{c1::CAP}}, uma caixa por **companhia**, e pagam **2** (empregado e empresa). No {{c2::IAP}}, um instituto por **profissão**, e pagam **3** (entra o Estado)."
  extra: "Os IAPs começam em 1933 e têm gestão semipública."
  fonte: "Parte 3 · seção 2.2 · slide 11"

- id: iaps-pegadinha
  tag: vargas
  tema: "Pegadinha"
  frente: "Certo ou errado: “os IAPs eram para trabalhadores de determinadas empresas, fruto da fusão das CAPs”."
  verso: "**Errado.** O que define o IAP é a **categoria profissional**, e não a empresa."
  extra: "Na versão do Compilado B, o item diz “categorias profissionais, ao contrário das CAPs”, e aí é verdadeiro."
  prova: "Prova 82 (Q4, item IV); Compilado B (Q4)"
  fonte: "Parte 3 · seção 2.2"

- id: sesp
  tag: vargas
  tema: "SESP (1942)"
  frente: "O que foi o SESP (1942) e qual era o seu objetivo?"
  verso: "Serviço Especial de Saúde Pública, criado com os **Estados Unidos** para sanear regiões de **matérias-primas** estratégicas na guerra."
  img: a3-s13.jpg
  extra: "Borracha da Amazônia; ferro e mica do Vale do Rio Doce. Depois da guerra, montou no Nordeste unidades que juntavam **medicina preventiva e curativa**."
  fonte: "Parte 3 · seção 2.3 · slides 12 e 13"

- id: ministerio-saude
  tag: vargas
  tema: "Período democrático"
  frente: "Em que ano foi criado o Ministério da Saúde?"
  verso: "Em **1953**, separado da Educação."
  fonte: "Parte 3 · seção 2.4 · slide 14"

- id: rede-propria
  tag: vargas
  tema: "Período democrático"
  frente: "Até 1964, como a previdência prestava a assistência médica?"
  verso: "Em **rede própria** dos institutos: hospitais, ambulatórios e consultórios dos IAPs."
  extra: "A compra de serviços privados como regra é do Regime Militar."
  fonte: "Parte 3 · seção 2.4 · slide 14"

# ---------------------------------------------------------------- 3 · Regime Militar e os três subsistemas
- id: inps-consequencias
  tag: militar
  tema: "INPS (1966)"
  cloze: "O INPS (1966), que unificou os IAPs:\n\n- {{c1::uniformizou os benefícios}};\n- acabou com a {{c2::gestão tripartite}};\n- centralizou a gestão no governo federal;\n- privilegiou as ações {{c3::curativas e individuais}};\n- ampliou a cobertura a rurais (1971), domésticas (1972) e autônomos (1973)."
  fonte: "Parte 3 · seção 3.1 · slides 15 e 16"

- id: privatista-funcionamento
  tag: militar
  tema: "Médico-assistencial privatista"
  frente: "Como funcionava o modelo médico-assistencial privatista?"
  verso: "A previdência arrecadava e **comprava serviços** de hospitais privados, **pagando por procedimento**; quem não tinha carteira ficava de fora."
  img: p3-privatista.svg
  extra: "O pagamento por procedimento premiava a quantidade, e não a resolução."
  fonte: "Parte 3 · seção 3.2 · slides 16 a 18"

- id: fas-ppa
  tag: militar
  tema: "Médico-assistencial privatista"
  cloze: "Em 1974, o {{c1::FAS}} financiou a construção de hospitais (a maioria privados), e o {{c2::PPA}} ampliou a contratação de hospitais e clínicas particulares para urgências."
  fonte: "Parte 3 · seção 3.2 · slide 18"

- id: binomio-pegadinha
  tag: militar
  tema: "Pegadinha"
  frente: "Certo ou errado: “na Nova República (1985–1988), as políticas de saúde fortaleceram o setor privado com a compra de serviços e empréstimos subsidiados”."
  verso: "**Errado.** Isso descreve o **Regime Militar** (binômio Previdência–Assistência Médica)."
  prova: "Prova 82 (Q4, item V); Compilado B (Q4)"
  fonte: "Parte 3 · seção 3.2 · Na prova"

- id: inamps
  tag: militar
  tema: "SINPAS e INAMPS (1977)"
  frente: "No SINPAS (1977), qual passou a ser o papel do INAMPS?"
  verso: "A **assistência médica individual e curativa**, prestada por serviços **privados e conveniados**."
  img: p3-sinpas.svg
  extra: "INPS paga os benefícios, INAMPS trata os segurados, IAPAS arrecada."
  fonte: "Parte 3 · seção 3.3 · slide 19"

- id: sub-caps
  tag: militar
  tema: "Os três subsistemas"
  frente: "Como eram as **CAPs** quanto à organização, ao financiamento e à gestão?"
  oculta: p3-previdencia-oculta-caps.svg
  revelada: p3-previdencia.svg
  verso: "Por **empresa**; financiamento **bipartite** (empregados e empregadores); gestão **privada**, por colegiado."
  prova: "Prova 85 (Q8); Compilado A (Q6); Turmas 84 e 86"
  fonte: "Parte 3 · seção 3.4 · slide 9"

- id: sub-iaps
  tag: militar
  tema: "Os três subsistemas"
  frente: "Como eram os **IAPs** quanto à organização, ao financiamento e à gestão?"
  oculta: p3-previdencia-oculta-iaps.svg
  revelada: p3-previdencia.svg
  verso: "Por **categoria profissional**; financiamento **tripartite** (empregados, empregadores e Estado); gestão **semipública**."
  prova: "Prova 85 (Q8); Compilado A (Q6); Turmas 84 e 86"
  fonte: "Parte 3 · seção 3.4 · slide 11"

- id: sub-inps
  tag: militar
  tema: "Os três subsistemas"
  frente: "Como era o **INPS** quanto à organização, ao financiamento e à gestão?"
  oculta: p3-previdencia-oculta-inps.svg
  revelada: p3-previdencia.svg
  verso: "**Instituto único**, com benefícios iguais; **contribuições sobre a folha**; gestão **centralizada**, sem a participação tripartite."
  prova: "Prova 85 (Q8); Compilado A (Q6); Turmas 84 e 86"
  fonte: "Parte 3 · seção 3.4 · slide 16"

- id: sub-resposta
  tag: militar
  tema: "Os três subsistemas"
  frente: "Na questão “caracterize os três subsistemas que vieram antes do SUS”, quais são eles e que critérios usar?"
  verso: "**CAPs, IAPs e INPS**, por **organização, financiamento e gestão** (e cobertura)."
  extra: "<span class=\"div\">⚠ Alguns gabaritos de alunos usam os modelos de atenção ou o tripé da seguridade, que é da CF88. Os slides 9, 11 e 16 caracterizam CAPs, IAPs e INPS.</span>"
  prova: "Prova 85 (Q8); Compilado A (Q6); Prova 89"
  fonte: "Parte 3 · seção 3.4"

- id: sub-seguro
  tag: militar
  tema: "Pegadinha"
  frente: "Certo ou errado: “por adotar uma concepção ampla do direito à saúde, a CF88 escolheu o seguro social”."
  verso: "**Errado.** A CF88 adotou a **seguridade social**. O **seguro social**, em que só tem direito quem contribui, era o modelo das CAPs, dos IAPs e do INPS."
  prova: "Prova 82 (Q4, item I); Compilado B (Q4)"
  fonte: "Parte 3 · seção 3.4"

# ---------------------------------------------------------------- 4 · Da crise do modelo ao SUDS
- id: alma-ata-iniciativas
  tag: reforma-sanitaria
  tema: "Iniciativas na linha de Alma-Ata"
  frente: "Cite duas iniciativas brasileiras em consonância com Alma-Ata (1978) que buscavam ampliar a cobertura."
  verso: "Duas entre **PIASS** (1976), **PREV-SAÚDE** (1980) e **AIS** (1983)."
  extra: "<span class=\"div\">⚠ Uma versão do gabarito traz “AIS e SUDS”; PIASS e AIS são mais seguras, por serem de atenção básica.</span> O PREV-SAÚDE não chegou a ser implantado."
  prova: "Compilado B (Q8); Prova 82 (Q7); prova do grupo (2020.2)"
  fonte: "Parte 3 · seção 4.1 · slide 20"

- id: piass-pegadinha
  tag: reforma-sanitaria
  tema: "Pegadinha"
  frente: "Certo ou errado: “o PIASS tinha como objetivo levar assistência à saúde aos trabalhadores rurais, até então excluídos das ações previdenciárias”."
  verso: "**Errado.** Os rurais tinham cobertura desde **1971** (FUNRURAL). O PIASS (1976) **interiorizou** as ações básicas de saúde e saneamento, a começar pelo Nordeste."
  prova: "Prova 89 (Q4, item I); Turma 90"
  fonte: "Parte 3 · seção 4.1 · slide 20"

- id: conasp
  tag: reforma-sanitaria
  tema: "CONASP (1981)"
  frente: "O que o CONASP (1981) propôs para o modelo assistencial?"
  verso: "**Melhorar a qualidade**, **ampliar** os serviços, **descentralizar** e **hierarquizar** por complexidade."
  extra: "Era ligado ao INAMPS. Dele vieram as AIS."
  fonte: "Parte 3 · seção 4.2 · slide 21"

- id: ais-objetivo
  tag: reforma-sanitaria
  tema: "AIS (1983)"
  frente: "Qual era o objetivo das Ações Integradas de Saúde (AIS, 1983)?"
  verso: "**Articular os serviços** de uma região e **integrar as ações preventivas e curativas**."
  extra: "O INAMPS repassava **10%** da arrecadação às Secretarias Estaduais de Saúde. As AIS são o embrião do SUDS e do SUS."
  fonte: "Parte 3 · seção 4.2 · slide 22"

- id: ais-pegadinha
  tag: reforma-sanitaria
  tema: "Pegadinha"
  frente: "Certo ou errado: “as AIS foram estabelecidas no final da década de 1960”."
  verso: "**Errado.** As AIS são de **1983**."
  prova: "Prova 89 (Q4, item II); Turma 90"
  fonte: "Parte 3 · seção 4.2"

- id: cebes-abrasco
  tag: reforma-sanitaria
  tema: "Reforma Sanitária"
  cloze: "Duas entidades da Reforma Sanitária: o {{c1::CEBES}} (1976), com a revista *Saúde em Debate*, e a {{c2::ABRASCO}} (1978 no slide; fundada formalmente em 1979)."
  img: a3-s23.jpg
  extra: "Os atores do slide 23: trabalhadores, sindicatos, intelectuais, lideranças populares e estudantes."
  fonte: "Parte 3 · seção 4.3 · slide 23"

- id: rsb-proposta
  tag: reforma-sanitaria
  tema: "Reforma Sanitária"
  frente: "O que a Reforma Sanitária propunha (slides 24 e 25)?"
  verso: "Um **Sistema Único de Saúde**, com **universalização** do direito, **integralidade** e **descentralização**."
  img: p3-reforma.svg
  fonte: "Parte 3 · seção 4.3 · slides 24 e 25"

- id: rsb-nomeie
  tag: reforma-sanitaria
  tema: "Reconheça"
  frente: "“Projeto articulado nos anos 70 e 80 para reformular um sistema de assistência curativa, privada e lucrativa, excludente, pouco resolutiva e dispendiosa.” Como se chama?"
  verso: "**Movimento da Reforma Sanitária Brasileira.**"
  extra: "<span class=\"div\">⚠ “Modelo médico-assistencial privatista” e “INAMPS” são o modelo criticado e o órgão que o executava, e não o projeto de reforma.</span>"
  prova: "Compilado B (Q7); Prova 82 (Q6); prova do grupo (2020.2)"
  fonte: "Parte 3 · seção 4.3 · Na prova"

- id: oitava-marco
  tag: reforma-sanitaria
  tema: "8ª CNS (1986)"
  frente: "Qual é o marco da Reforma Sanitária Brasileira?"
  verso: "A **8ª Conferência Nacional de Saúde (1986)**."
  extra: "Na discursiva: participação popular, conceito ampliado de saúde e saúde como direito de todos e dever do Estado, base do texto da saúde na CF88. Foi presidida por Sergio Arouca."
  prova: "Prova 85 (Q1); Compilado A (Q1); Prova 89 (Q8); Turma 86"
  fonte: "Parte 3 · seção 4.4 · slide 26"

- id: oitava-usuarios
  tag: reforma-sanitaria
  tema: "8ª CNS (1986)"
  frente: "O que a 8ª CNS teve de inédito em relação às conferências anteriores?"
  verso: "Foi a **primeira com a participação dos usuários**."
  extra: "Daí vem a participação da comunidade, que se tornaria diretriz do SUS."
  fonte: "Parte 3 · seção 4.4 · slide 26"

- id: suds
  tag: reforma-sanitaria
  tema: "SUDS (1987)"
  frente: "O que foi o SUDS (1987)?"
  verso: "O Sistema Unificado e Descentralizado de Saúde: aprofundou as AIS e transferiu rede e recursos do INAMPS para os **estados**."
  fonte: "Parte 3 · seção 4.5 · slides 28 e 29"

- id: suds-caracteristicas
  tag: reforma-sanitaria
  tema: "SUDS (1987)"
  cloze: "SUDS (1987):\n\n- convênios entre União, estados e municípios;\n- {{c1::conselhos estaduais e municipais de saúde}};\n- {{c2::estadualização do INAMPS}};\n- investimentos dirigidos ao setor público;\n- cobertura ainda {{c3::insuficiente}};\n- poder concentrado nas secretarias estaduais e {{c4::relação clientelista}} entre estado e município."
  fonte: "Parte 3 · seção 4.5 · slide 29"

- id: suds-pegadinha
  tag: reforma-sanitaria
  tema: "Pegadinha"
  frente: "Certo ou errado: “com a implantação do SUDS, ocorreu a municipalização do INAMPS”."
  verso: "**Errado.** O SUDS promoveu a **estadualização** do INAMPS. A municipalização é marca do SUS."
  extra: "<span class=\"div\">⚠ Um gabarito marca V-F-V nesse V ou F; as justificativas da Prova 89 sustentam F-F-F.</span>"
  prova: "Prova 89 (Q4, item III); Turma 90; Prova 85 (Q5)"
  fonte: "Parte 3 · seção 4.5"

- id: linha-reformas
  tag: reforma-sanitaria
  tema: "Linha do tempo"
  cloze: "PIASS ({{c1::1976}}) → INAMPS ({{c2::1977}}) → CONASP ({{c3::1981}}) → AIS ({{c4::1983}}) → 8ª CNS ({{c5::1986}}) → SUDS ({{c6::1987}}) → SUS na Constituição (1988)."
  fonte: "Parte 3 · Resumo"
