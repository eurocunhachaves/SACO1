olygon points="82.2,172 345.8,172 410.0,250 18.0,250" class="cm"/><polygon points="82.2,172 345.8,172 410.0,250 18.0,250" class="sw nf" stroke-width="2.5" stroke-linejoin="round"/><text x="214.0" y="209.0" font-size="11.2" font-weight="850" letter-spacing="0.8" class="w" text-anchor="middle"><tspan x="214.0" dy="0.0">ATENÇÃO PRIMÁRIA À SAÚDE</tspan></text><text x="214.0" y="224.0" font-size="8.8" font-weight="500" class="w" text-anchor="middle"><tspan x="214.0" dy="0.0">porta de entrada · ordena o cuidado</tspan></text><line x1="383.9" y1="211.0" x2="436.0" y2="211.0" class="scl nf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="436.0" y="185.0" width="230.0" height="52.0" rx="10" class="ct" /><text x="448.0" y="206.0" font-size="9.6" font-weight="500" class="ink" text-anchor="start"><tspan x="448.0" dy="0.0">UBS e Saúde da Família: acolhe, acompanha</tspan><tspan x="448.0" dy="12.0">e resolve a maior parte dos problemas</tspan></text><line x1="22.0" y1="72.0" x2="22.0" y2="25.6" class="scd nf" stroke-width="2.2" stroke-linecap="round" /><polygon points="22.0,20.0 18.1,27.0 25.9,27.0" class="cd"/><text x="32.0" y="30.0" font-size="9.4" font-weight="800" class="cd" text-anchor="start"><tspan x="32.0" dy="0.0">referência:</tspan></text><text x="32.0" y="43.0" font-size="8.8" font-weight="500" class="ink2" text-anchor="start"><tspan x="32.0" dy="0.0">encaminha a um</tspan><tspan x="32.0" dy="10.6">nível mais complexo</tspan></text><line x1="22.0" y1="92.0" x2="22.0" y2="138.4" class="scm nf" stroke-width="2.2" stroke-linecap="round" /><polygon points="22.0,144.0 25.9,137.0 18.1,137.0" class="cm"/><text x="32.0" y="104.0" font-size="9.4" font-weight="800" class="c" text-anchor="start"><tspan x="32.0" dy="0.0">contrarreferência:</tspan></text><text x="32.0" y="117.0" font-size="8.8" font-weight="500" class="ink2" text-anchor="start"><tspan x="32.0" dy="0.0">devolve à APS, que</tspan><tspan x="32.0" dy="10.6">segue o cuidado</tspan></text></svg