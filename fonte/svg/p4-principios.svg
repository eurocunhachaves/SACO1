<svg class="dg" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect x="230.0" y="8.0" width="220.0" height="38.0" rx="19" class="cd" /><text x="340.0" y="32.0" font-size="12.4" font-weight="850" letter-spacing="1.2" class="w" text-anchor="middle"><tspan x="340.0" dy="0.0">PRINCÍPIOS DO SUS</tspan></text><path d="M340,46 L340,58 M172,58 L508,58 M172,58 L172,72 M508,58 L508,72" class="scm nf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="14.0" y="72.0" width="316.0" height="196.0" rx="14" class="ct" /><rect x="14.0" y="72.0" width="316.0" height="46.0" rx="14" class="c" /><rect x="14.0" y="104.0" width="316.0" height="14.0" rx="0" class="c" /><text x="172.0" y="92.0" font-size="12.4" font-weight="850" letter-spacing="1.4" class="w" text-anchor="middle"><tspan x="172.0" dy="0.0">DOUTRINÁRIOS</tspan></text><text x="172.0" y="109.0" font-size="9.2" font-weight="500" class="w" text-anchor="middle"><tspan x="172.0" dy="0.0">o que o SUS garante: a finalidade</tspan></text><rect x="24.0" y="128.0" width="296.0" height="42.0" rx="10" class="w" /><text x="36.0" y="147.0" font-size="11.6" font-weight="800" class="cd" text-anchor="start"><tspan x="36.0" dy="0.0">Universalidade</tspan></text><text x="36.0" y="162.0" font-size="9.4" font-weight="500" class="ink2" text-anchor="start"><tspan x="36.0" dy="0.0">acesso para todos, em todos os níveis de atenção</tspan></text><rect x="24.0" y="174.0" width="296.0" height="42.0" rx="10" class="w" /><text x="36.0" y="193.0" font-size="11.6" font-weight="800" class="cd" text-anchor="start"><tspan x="36.0" dy="0.0">Igualdade / equidade</tspan></text><text x="36.0" y="208.0" font-size="9.4" font-weight="500" class="ink2" text-anchor="start"><tspan x="36.0" dy="0.0">sem privilégios; mais a quem precisa mais</tspan></text><rect x="24.0" y="220.0" width="296.0" height="42.0" rx="10" class="w" /><text x="36.0" y="239.0" font-size="11.6" font-weight="800" class="cd" text-anchor="start"><tspan x="36.0" dy="0.0">Integralidade</tspan></text><text x="36.0" y="254.0" font-size="9.4" font-weight="500" class="ink2" text-anchor="start"><tspan x="36.0" dy="0.0">prevenção e cura, do individual ao coletivo</tspan></text><rect x="350.0" y="72.0" width="316.0" height="196.0" rx="14" class="ct" /><rect x="350.0" y="72.0" width="316.0" height="46.0" rx="14" class="cd" /><rect x="350.0" y="104.0" width="316.0" height="14.0" rx="0" class="cd" /><text x="508.0" y="92.0" font-size="12.4" font-weight="850" letter-spacing="1.4" class="w" text-anchor="middle"><tspan x="508.0" dy="0.0">ORGANIZATIVOS</tspan></text><text x="508.0" y="109.0" font-size="9.2" font-weight="500" class="w" text-anchor="middle"><tspan x="508.0" dy="0.0">como o SUS se organiza para cumprir os doutrinários</tspan></text><rect x="360.0" y="128.0" width="296.0" height="42.0" rx="10" class="w" /><text x="372.0" y="147.0" font-size="11.6" font-weight="800" class="cd" text-anchor="start"><tspan x="372.0" dy="0.0">Descentralização</tspan></text><text x="372.0" y="162.0" font-size="9.4" font-weight="500" class="ink2" text-anchor="start"><tspan x="372.0" dy="0.0">direção única em cada esfera; ênfase nos municípios</tspan></text><rect x="360.0" y="174.0" width="296.0" height="42.0" rx="10" class="w" /><text x="372.0" y="193.0" font-size="11.6" font-weight="800" class="cd" text-anchor="start"><tspan x="372.0" dy="0.0">Regionalização e hierarquização</tspan></text><text x="372.0" y="208.0" font-size="9.4" font-weight="500" class="ink2" text-anchor="start"><tspan x="372.0" dy="0.0">territórios e níveis de complexidade crescente</tspan></text><rect x="360.0" y="220.0" width="296.0" height="42.0" rx="10" class="w" /><text x="372.0" y="239.0" font-size="11.6" font-weight="800" class="cd" text-anchor="start"><tspan x="372.0" dy="0.0">Participação e controle social</tspan></text><text x="372.0" y="254.0" font-size="9.4" font-weight="500" class="ink2" text-anchor="start"><tspan x="372.0" dy="0.0">conselhos e conferências de saúde</tspan></text><text x="340.0" y="290.0" font-size="9" font-weight="500" font-style="italic" class="mut" text-anchor="middle"><tspan x="340.0" dy="0.0">O ABC do SUS (1990) lista ainda resolubilidade e complementaridade do setor privado entre os organizativos.</tspan></text></svg>