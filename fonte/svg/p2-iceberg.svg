<svg class="dg" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><rect x="0.0" y="112.0" width="680.0" height="218.0" rx="0" class="ct" /><path d="M0,112 Q85,106 170,112 T340,112 T510,112 T680,112" class="scm nf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="206,112 256,40 286,58 308,30 366,112" class="w"/><polygon points="206,112 256,40 286,58 308,30 366,112" class="scd nf" stroke-width="2"/><polygon points="206,112 366,112 468,200 424,300 170,312 86,236" class="cl"/><polygon points="206,112 366,112 468,200 424,300 170,312 86,236" class="scm nf" stroke-width="2"/><text x="286.0" y="92.0" font-size="11.4" font-weight="800" class="cd" text-anchor="middle"><tspan x="286.0" dy="0.0">comportamentos</tspan></text><text x="276.0" y="150.0" font-size="11.2" font-weight="700" class="cd" text-anchor="middle"><tspan x="276.0" dy="0.0">renda e trabalho</tspan></text><text x="276.0" y="175.0" font-size="11.2" font-weight="700" class="cd" text-anchor="middle"><tspan x="276.0" dy="0.0">moradia e saneamento</tspan></text><text x="276.0" y="200.0" font-size="11.2" font-weight="700" class="cd" text-anchor="middle"><tspan x="276.0" dy="0.0">escolaridade</tspan></text><text x="276.0" y="225.0" font-size="11.2" font-weight="700" class="cd" text-anchor="middle"><tspan x="276.0" dy="0.0">redes de apoio</tspan></text><text x="276.0" y="250.0" font-size="11.2" font-weight="700" class="cd" text-anchor="middle"><tspan x="276.0" dy="0.0">cultura e propaganda</tspan></text><text x="276.0" y="275.0" font-size="11.2" font-weight="700" class="cd" text-anchor="middle"><tspan x="276.0" dy="0.0">políticas econômicas</tspan></text><text x="400.0" y="46.0" font-size="10.4" font-weight="800" letter-spacing="1.2" class="c2" text-anchor="start"><tspan x="400.0" dy="0.0">ENFOQUE COMPORTAMENTAL</tspan></text><text x="400.0" y="66.0" font-size="10.6" font-weight="500" class="ink2" text-anchor="start"><tspan x="400.0" dy="0.0">Vê só o que está acima da água:</tspan><tspan x="400.0" dy="14.0">fumo, dieta, sedentarismo.</tspan><tspan x="400.0" dy="14.0">Ação: educar o indivíduo.</tspan></text><text x="500.0" y="176.0" font-size="10.4" font-weight="800" letter-spacing="1.2" class="cd" text-anchor="start"><tspan x="500.0" dy="0.0">ENFOQUE SOCIOAMBIENTAL</tspan></text><text x="500.0" y="196.0" font-size="10.6" font-weight="500" class="ink2" text-anchor="start"><tspan x="500.0" dy="0.0">Mergulha nos determinantes</tspan><tspan x="500.0" dy="14.0">que produzem os</tspan><tspan x="500.0" dy="14.0">comportamentos.</tspan><tspan x="500.0" dy="14.0">Ação: políticas públicas</tspan><tspan x="500.0" dy="14.0">e intersetorialidade.</tspan></text></svg>