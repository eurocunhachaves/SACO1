<svg class="dg" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><text x="14.0" y="16.0" font-size="8.8" font-weight="800" letter-spacing="1.3" class="mut" text-anchor="start"><tspan x="14.0" dy="0.0">O TEXTO DO ART. 196</tspan></text><text x="436.0" y="16.0" font-size="8.8" font-weight="800" letter-spacing="1.3" class="mut" text-anchor="start"><tspan x="436.0" dy="0.0">O QUE O TRECHO REVELA</tspan></text><rect x="14.0" y="26.0" width="382.0" height="38.0" rx="10" class="ct" /><rect x="14.0" y="26.0" width="5.0" height="38.0" rx="2.5" class="c" /><text x="30.0" y="49.0" font-size="11.4" font-weight="600" font-style="italic" class="ink" text-anchor="start"><tspan x="30.0" dy="0.0">A saúde é direito de todos</tspan></text><line x1="398.0" y1="45.0" x2="427.2" y2="45.0" class="scm nf" stroke-width="1.8" stroke-linecap="round" /><polygon points="432.0,45.0 426.0,41.7 426.0,48.3" class="cm"/><rect x="436.0" y="29.0" width="230.0" height="32.0" rx="16" class="c" /><text x="551.0" y="49.0" font-size="10.4" font-weight="750" class="w" text-anchor="middle"><tspan x="551.0" dy="0.0">universalidade · cidadania</tspan></text><rect x="14.0" y="69.0" width="382.0" height="38.0" rx="10" class="ct" /><rect x="14.0" y="69.0" width="5.0" height="38.0" rx="2.5" class="c" /><text x="30.0" y="92.0" font-size="11.4" font-weight="600" font-style="italic" class="ink" text-anchor="start"><tspan x="30.0" dy="0.0">e dever do Estado,</tspan></text><line x1="398.0" y1="88.0" x2="427.2" y2="88.0" class="scm nf" stroke-width="1.8" stroke-linecap="round" /><polygon points="432.0,88.0 426.0,84.7 426.0,91.3" class="cm"/><rect x="436.0" y="72.0" width="230.0" height="32.0" rx="16" class="cl" /><text x="551.0" y="92.0" font-size="10.4" font-weight="750" class="cd" text-anchor="middle"><tspan x="551.0" dy="0.0">responsabilidade do Estado</tspan></text><rect x="14.0" y="112.0" width="382.0" height="38.0" rx="10" class="ct" /><rect x="14.0" y="112.0" width="5.0" height="38.0" rx="2.5" class="c" /><text x="30.0" y="135.0" font-size="11.4" font-weight="600" font-style="italic" class="ink" text-anchor="start"><tspan x="30.0" dy="0.0">garantido mediante políticas sociais e econômicas</tspan></text><line x1="398.0" y1="131.0" x2="427.2" y2="131.0" class="scm nf" stroke-width="1.8" stroke-linecap="round" /><polygon points="432.0,131.0 426.0,127.7 426.0,134.3" class="cm"/><rect x="436.0" y="115.0" width="230.0" height="32.0" rx="16" class="cl" /><text x="551.0" y="128.5" font-size="10.4" font-weight="750" class="cd" text-anchor="middle"><tspan x="551.0" dy="0.0">conceito ampliado · determinação</tspan><tspan x="551.0" dy="12.5">social · intersetorialidade</tspan></text><rect x="14.0" y="155.0" width="382.0" height="38.0" rx="10" class="ct" /><rect x="14.0" y="155.0" width="5.0" height="38.0" rx="2.5" class="c" /><text x="30.0" y="178.0" font-size="11.4" font-weight="600" font-style="italic" class="ink" text-anchor="start"><tspan x="30.0" dy="0.0">que visem à redução do risco de doença e de outros agravos</tspan></text><line x1="398.0" y1="174.0" x2="427.2" y2="174.0" class="scm nf" stroke-width="1.8" stroke-linecap="round" /><polygon points="432.0,174.0 426.0,170.7 426.0,177.3" class="cm"/><rect x="436.0" y="158.0" width="230.0" height="32.0" rx="16" class="cl" /><text x="551.0" y="178.0" font-size="10.4" font-weight="750" class="cd" text-anchor="middle"><tspan x="551.0" dy="0.0">prevenção dos riscos</tspan></text><rect x="14.0" y="198.0" width="382.0" height="38.0" rx="10" class="ct" /><rect x="14.0" y="198.0" width="5.0" height="38.0" rx="2.5" class="c" /><text x="30.0" y="221.0" font-size="11.4" font-weight="600" font-style="italic" class="ink" text-anchor="start"><tspan x="30.0" dy="0.0">e ao acesso universal e igualitário às ações e serviços</tspan></text><line x1="398.0" y1="217.0" x2="427.2" y2="217.0" class="scm nf" stroke-width="1.8" stroke-linecap="round" /><polygon points="432.0,217.0 426.0,213.7 426.0,220.3" class="cm"/><rect x="436.0" y="201.0" width="230.0" height="32.0" rx="16" class="c" /><text x="551.0" y="221.0" font-size="10.4" font-weight="750" class="w" text-anchor="middle"><tspan x="551.0" dy="0.0">universalidade · igualdade (equidade)</tspan></text><rect x="14.0" y="241.0" width="382.0" height="38.0" rx="10" class="ct" /><rect x="14.0" y="241.0" width="5.0" height="38.0" rx="2.5" class="c" /><text x="30.0" y="264.0" font-size="11.4" font-weight="600" font-style="italic" class="ink" text-anchor="start"><tspan x="30.0" dy="0.0">para sua promoção, proteção e recuperação.</tspan></text><line x1="398.0" y1="260.0" x2="427.2" y2="260.0" class="scm nf" stroke-width="1.8" stroke-linecap="round" /><polygon points="432.0,260.0 426.0,256.7 426.0,263.3" class="cm"/><rect x="436.0" y="244.0" width="230.0" height="32.0" rx="16" class="c" /><text x="551.0" y="264.0" font-size="10.4" font-weight="750" class="w" text-anchor="middle"><tspan x="551.0" dy="0.0">integralidade</tspan></text><text x="666.0" y="286.0" font-size="8.8" font-weight="500" font-style="italic" class="mut" text-anchor="end"><tspan x="666.0" dy="0.0">Em azul forte, os três princípios doutrinários que a prova pede.</tspan></text></svg>