<svg class="dg" viewBox="0 0 680 346" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><path d="M340,173 C296.0,173 296.0,50 252,50" class="scl nf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M340,173 C296.0,173 296.0,173 252,173" class="scl nf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M340,173 C296.0,173 296.0,296 252,296" class="scl nf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M340,173 C384.0,173 384.0,50 428,50" class="scl nf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M340,173 C384.0,173 384.0,173 428,173" class="scl nf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M340,173 C384.0,173 384.0,296 428,296" class="scl nf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340.0" cy="173.0" r="64.0" class="cd" /><text x="340.0" y="165.0" font-size="12.4" font-weight="800" letter-spacing="1.4" class="w" text-anchor="middle"><tspan x="340.0" dy="0.0">O SUS</tspan></text><text x="340.0" y="183.0" font-size="12.4" font-weight="800" letter-spacing="1.4" class="w" text-anchor="middle"><tspan x="340.0" dy="0.0">NA CF88</tspan></text><text x="340.0" y="203.0" font-size="10.4" font-weight="700" class="cl" text-anchor="middle"><tspan x="340.0" dy="0.0">5/10/1988</tspan></text><rect x="14.0" y="2.0" width="238.0" height="96.0" rx="12" class="ct" /><rect x="14.0" y="2.0" width="238.0" height="28.0" rx="12" class="cd" /><rect x="14.0" y="18.0" width="238.0" height="12.0" rx="0" class="cd" /><text x="133.0" y="21.0" font-size="12.4" font-weight="800" class="w" text-anchor="middle"><tspan x="133.0" dy="0.0">Proteção social</tspan></text><text x="28.0" y="46.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• seguridade, seguro e assistência</tspan></text><text x="28.0" y="64.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• antes: seguro social (CAPs, IAPs)</tspan></text><text x="28.0" y="82.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• CF88: seguridade social</tspan></text><rect x="14.0" y="125.0" width="238.0" height="96.0" rx="12" class="ct" /><rect x="14.0" y="125.0" width="238.0" height="28.0" rx="12" class="c" /><rect x="14.0" y="141.0" width="238.0" height="12.0" rx="0" class="c" /><text x="133.0" y="144.0" font-size="12.4" font-weight="800" class="w" text-anchor="middle"><tspan x="133.0" dy="0.0">Seguridade (arts. 194 e 195)</tspan></text><text x="28.0" y="169.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• saúde, previdência e assistência</tspan></text><text x="28.0" y="187.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• só a previdência é contributiva</tspan></text><text x="28.0" y="205.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• financiada por toda a sociedade</tspan></text><rect x="14.0" y="248.0" width="238.0" height="96.0" rx="12" class="ct" /><rect x="14.0" y="248.0" width="238.0" height="28.0" rx="12" class="cm" /><rect x="14.0" y="264.0" width="238.0" height="12.0" rx="0" class="cm" /><text x="133.0" y="267.0" font-size="12.4" font-weight="800" class="w" text-anchor="middle"><tspan x="133.0" dy="0.0">Saúde (arts. 196 e 197)</tspan></text><text x="28.0" y="292.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• direito de todos, dever do Estado</tspan></text><text x="28.0" y="310.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• conceito ampliado de saúde</tspan></text><text x="28.0" y="328.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="28.0" dy="0.0">• ações de relevância pública</tspan></text><rect x="428.0" y="2.0" width="238.0" height="96.0" rx="12" class="ct" /><rect x="428.0" y="2.0" width="238.0" height="28.0" rx="12" class="cd" /><rect x="428.0" y="18.0" width="238.0" height="12.0" rx="0" class="cd" /><text x="547.0" y="21.0" font-size="12.4" font-weight="800" class="w" text-anchor="middle"><tspan x="547.0" dy="0.0">Arts. 198 a 200</tspan></text><text x="442.0" y="46.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• 198: diretrizes do sistema único</tspan></text><text x="442.0" y="64.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• 199: privado só complementar</tspan></text><text x="442.0" y="82.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• 200: competências do SUS</tspan></text><rect x="428.0" y="125.0" width="238.0" height="96.0" rx="12" class="ct" /><rect x="428.0" y="125.0" width="238.0" height="28.0" rx="12" class="c" /><rect x="428.0" y="141.0" width="238.0" height="12.0" rx="0" class="c" /><text x="547.0" y="144.0" font-size="12.4" font-weight="800" class="w" text-anchor="middle"><tspan x="547.0" dy="0.0">Princípios doutrinários</tspan></text><text x="442.0" y="169.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• universalidade</tspan></text><text x="442.0" y="187.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• igualdade e equidade</tspan></text><text x="442.0" y="205.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• integralidade</tspan></text><rect x="428.0" y="248.0" width="238.0" height="96.0" rx="12" class="ct" /><rect x="428.0" y="248.0" width="238.0" height="28.0" rx="12" class="cm" /><rect x="428.0" y="264.0" width="238.0" height="12.0" rx="0" class="cm" /><text x="547.0" y="267.0" font-size="12.4" font-weight="800" class="w" text-anchor="middle"><tspan x="547.0" dy="0.0">Princípios organizativos</tspan></text><text x="442.0" y="292.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• descentralização (direção única)</tspan></text><text x="442.0" y="310.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• regionalização e hierarquização</tspan></text><text x="442.0" y="328.0" font-size="10.8" font-weight="500" class="ink" text-anchor="start"><tspan x="442.0" dy="0.0">• participação e controle social</tspan></text></svg>